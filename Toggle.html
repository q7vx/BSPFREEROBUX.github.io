<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage Test</title>
    <style>
        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#1e1e1e;
            font-family:Arial,sans-serif;
        }

        button{
            padding:14px 28px;
            font-size:18px;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }
    </style>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5179004241080538" crossorigin="anonymous"></script>

<body>
    <button id="createPhone">Create Phone</button>

    <script>
        document.getElementById("createPhone").onclick = function(){
            localStorage.setItem("Phone", "1");
        };
    </script>
</body>
</html>

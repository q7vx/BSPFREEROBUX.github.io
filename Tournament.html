<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tournament Bracket</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#0d1119;color:#fff;font-family:Arial,Helvetica,sans-serif}
header{height:76px;padding:18px 26px;background:#111620;border-bottom:1px solid #252d3b;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:20}
h1{margin:0;font-size:23px}
.container{height:calc(100vh - 76px);display:flex;flex-direction:column}
.top{padding:16px 24px;background:#10151e;border-bottom:1px solid #252d3b;display:flex;gap:12px;align-items:center;position:relative;z-index:20}
input{width:280px;background:#0b0f16;border:1px solid #30394a;color:white;border-radius:9px;padding:11px 13px;font-size:14px;outline:none}
input:focus{border-color:#667cff}
button{border:0;background:#586cff;color:#fff;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.12)}
button.secondary{background:#252d3a}
button.danger{background:#c94b5d}
.players{display:flex;gap:7px;flex-wrap:wrap}
.player{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#181e29;border:1px solid #2b3443;border-radius:8px;font-size:13px}
.player button{padding:2px 7px;background:#303949;font-size:12px}
.bracket-scroll{position:relative;flex:1;overflow:auto;background:#0d1119}
.bracket{position:relative;min-width:1250px;min-height:100%;padding:45px 55px 100px}
.rounds{position:relative;display:flex;align-items:flex-start;gap:90px;z-index:2}
.round{width:220px;flex:0 0 220px;position:relative}
.round-title{text-align:center;color:#9ba8c1;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:25px}
.matches{position:relative}
.match{width:220px;background:#151b25;border:1px solid #30394a;border-radius:12px;overflow:hidden;position:absolute;left:0}
.team{height:43px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2b3442;cursor:pointer;color:#dbe1ec;white-space:nowrap}
.team:last-child{border-bottom:0}
.team:hover{background:#202734}
.team.winner{background:#18392a;color:#72efa5}
.team.loser{opacity:.35}
.team.empty{color:#637087;cursor:default}
.team-name{overflow:hidden;text-overflow:ellipsis}
.arrow{color:#8190a8;font-size:12px}
.match.final{border-color:#806cff;box-shadow:0 0 30px #806cff18}
.connections{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
.connection{fill:none;stroke:#465166;stroke-width:1.2}
.connection.active{stroke:#667cff;stroke-width:1.6}
.champion{position:absolute;top:calc(100% + 35px);left:50%;transform:translateX(-50%);text-align:center;width:220px}
.champion-label{font-size:12px;color:#8793aa;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.champion-name{background:#17152a;border:1px solid #806cff;border-radius:12px;padding:15px;color:#c2b9ff;font-size:18px;font-weight:bold}
.empty{text-align:center;color:#66738a;padding-top:70px}
@media(max-width:700px){
header{padding:15px}
.top{overflow:auto;white-space:nowrap}
.bracket{padding-left:25px}
}
</style>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5179004241080538" crossorigin="anonymous"></script>
</head>
<body>

<header>
<h1>🏆 Tournament Bracket</h1>
<div>
<button class="secondary" onclick="shufflePlayers()">Shuffle</button>
<button class="danger" onclick="resetTournament()">Reset</button>
</div>
</header>

<div class="container">

<div class="top">
<input id="playerInput" placeholder="Player name..." maxlength="40">
<button onclick="addPlayer()">Add Player</button>
<button onclick="generateTournament()">Generate</button>
<div class="players" id="players"></div>
</div>

<div class="bracket-scroll">
<div class="bracket" id="bracket">
<div class="empty">
<h2>No Tournament</h2>
<p>Add players and press Generate.</p>
</div>
</div>
</div>

</div>

<script>
let players=[];
let rounds=[];
let started=false;

const input=document.getElementById("playerInput");

input.addEventListener("keydown",e=>{
if(e.key==="Enter")addPlayer();
});

function addPlayer(){
if(started)return;
const name=input.value.trim();
if(!name)return;
if(players.some(x=>x.toLowerCase()===name.toLowerCase()))return;
players.push(name);
input.value="";
renderPlayers();
}

function removePlayer(i){
if(started)return;
players.splice(i,1);
renderPlayers();
}

function renderPlayers(){
const box=document.getElementById("players");
box.innerHTML="";
players.forEach((name,i)=>{
const el=document.createElement("div");
el.className="player";
el.innerHTML=`<span>${escapeHtml(name)}</span><button onclick="removePlayer(${i})">×</button>`;
box.appendChild(el);
});
}

function shufflePlayers(){
if(started)return;
for(let i=players.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[players[i],players[j]]=[players[j],players[i]];
}
renderPlayers();
}

function resetTournament(){
players=[];
rounds=[];
started=false;
renderPlayers();
document.getElementById("bracket").innerHTML=`
<div class="empty">
<h2>No Tournament</h2>
<p>Add players and press Generate.</p>
</div>`;
}

function powerOfTwo(n){
let x=1;
while(x<n)x*=2;
return x;
}

function generateTournament(){
if(players.length<2)return;

started=true;

let size=powerOfTwo(players.length);
let list=[...players];

while(list.length<size)list.push(null);

rounds=[];

let first=[];
for(let i=0;i<list.length;i+=2){
first.push({
a:list[i],
b:list[i+1],
winner:null
});
}

rounds.push(first);

let matches=first.length;

while(matches>1){
matches=Math.ceil(matches/2);
let round=[];

for(let i=0;i<matches;i++){
round.push({
a:null,
b:null,
winner:null
});
}

rounds.push(round);
}

syncRounds();
renderBracket();
}

function syncRounds(){
for(let r=1;r<rounds.length;r++){
const previous=rounds[r-1];

for(let m=0;m<rounds[r].length;m++){
const left=previous[m*2];
const right=previous[m*2+1];

rounds[r][m].a=left?left.winner:null;
rounds[r][m].b=right?right.winner:null;

const current=rounds[r][m];

if(current.winner!==current.a&&current.winner!==current.b){
current.winner=null;
}
}
}
}

function chooseWinner(r,m,name){
if(!name)return;

const match=rounds[r][m];

if(match.winner===name){
match.winner=null;
}else{
match.winner=name;
}

for(let x=r+1;x<rounds.length;x++){
for(let y=0;y<rounds[x].length;y++){
rounds[x][y].winner=null;
}
}

syncRounds();
renderBracket();
}

function renderBracket(){
const root=document.getElementById("bracket");

root.innerHTML=`
<svg class="connections" id="connections"></svg>
<div class="rounds" id="rounds"></div>
`;

const roundsContainer=document.getElementById("rounds");

rounds.forEach((round,r)=>{
const roundElement=document.createElement("div");
roundElement.className="round";
roundElement.dataset.round=r;

const title=document.createElement("div");
title.className="round-title";

if(r===rounds.length-1){
title.textContent="FINAL";
}else if(r===rounds.length-2){
title.textContent="SEMI FINALS";
}else{
title.textContent=`ROUND ${r+1}`;
}

roundElement.appendChild(title);

const matches=document.createElement("div");
matches.className="matches";

const gap=Math.pow(2,r)*22;
const matchHeight=87;
const firstOffset=(Math.pow(2,r)-1)*((matchHeight+gap)/2);

matches.style.height=Math.max(
round.length*matchHeight+(round.length-1)*gap+firstOffset,
matchHeight
)+"px";

round.forEach((match,m)=>{
const card=document.createElement("div");
card.className="match";
card.dataset.round=r;
card.dataset.match=m;

if(r===rounds.length-1)card.classList.add("final");

const position=firstOffset+m*(matchHeight+gap);

card.style.top=position+"px";

card.appendChild(createTeam(match.a,match.winner,r,m));
card.appendChild(createTeam(match.b,match.winner,r,m));

matches.appendChild(card);
});

roundElement.appendChild(matches);
roundsContainer.appendChild(roundElement);
});

requestAnimationFrame(()=>{
drawConnections();

const final=rounds[rounds.length-1][0];

if(final&&final.winner){
const finalCard=document.querySelector(
`.match[data-round="${rounds.length-1}"][data-match="0"]`
);

if(finalCard){
const champion=document.createElement("div");
champion.className="champion";
champion.innerHTML=`
<div class="champion-label">Tournament Champion</div>
<div class="champion-name">🏆 ${escapeHtml(final.winner)}</div>
`;
finalCard.appendChild(champion);
}
}
});
}

function createTeam(name,winner,r,m){
const team=document.createElement("div");
team.className="team";

if(!name){
team.classList.add("empty");
team.innerHTML=`<span class="team-name">Waiting...</span>`;
return team;
}

if(winner===name)team.classList.add("winner");
if(winner&&winner!==name)team.classList.add("loser");

team.innerHTML=`
<span class="team-name">${escapeHtml(name)}</span>
<span class="arrow">${winner===name?"✓":"→"}</span>
`;

team.onclick=()=>{
chooseWinner(r,m,name);
};

return team;
}

function drawConnections(){
const bracket=document.getElementById("bracket");
const svg=document.getElementById("connections");

if(!bracket||!svg)return;

const rect=bracket.getBoundingClientRect();

svg.setAttribute("width",bracket.scrollWidth);
svg.setAttribute("height",bracket.scrollHeight);
svg.setAttribute("viewBox",`0 0 ${bracket.scrollWidth} ${bracket.scrollHeight}`);

svg.innerHTML="";

for(let r=0;r<rounds.length-1;r++){
const current=rounds[r];

for(let m=0;m<current.length;m++){
const source=document.querySelector(
`.match[data-round="${r}"][data-match="${m}"]`
);

if(!source)continue;

const nextIndex=Math.floor(m/2);

const target=document.querySelector(
`.match[data-round="${r+1}"][data-match="${nextIndex}"]`
);

if(!target)continue;

const sourceRect=source.getBoundingClientRect();
const targetRect=target.getBoundingClientRect();

const x1=sourceRect.right-rect.left;
const y1=sourceRect.top+sourceRect.height/2-rect.top;

const x2=targetRect.left-rect.left;
const y2=targetRect.top+targetRect.height/2-rect.top;

const midX=x1+(x2-x1)/2;

const path=document.createElementNS("http://www.w3.org/2000/svg","path");

path.setAttribute(
"d",
`M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`
);

path.classList.add("connection");

if(current[m].winner)path.classList.add("active");

svg.appendChild(path);
}
}
}

function escapeHtml(value){
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

window.addEventListener("resize",()=>{
if(started)drawConnections();
});

document.querySelector(".bracket-scroll").addEventListener("scroll",()=>{
if(started)drawConnections();
});

renderPlayers();
</script>

</body>
</html>

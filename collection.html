<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Collection | Zyphor</title><style>body{margin:0;background:#090b10;color:#f4f6fb;font:16px system-ui}main{width:min(1100px,calc(100% - 32px));margin:auto;padding:28px 0}header{display:flex;justify-content:space-between;align-items:center}a{color:#9ca3ff;text-decoration:none}.panel{margin:26px 0;padding:24px;border:1px solid #29303d;border-radius:18px;background:#141821}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.item{padding:16px;border:1px solid #29303d;border-radius:14px}.icon{font-size:36px}.muted{color:#a0a8b8}.copies{margin-top:10px;border-top:1px solid #29303d;padding-top:7px}.copies summary{cursor:pointer;color:#c4b5fd;font-size:12px}.copy{font-size:12px;border-bottom:1px solid #29303d;padding:8px 0;overflow-wrap:anywhere}.copy:last-child{border-bottom:0}.copyid{font-weight:800;color:#e4e7ff}.copyhistory{font-size:11px;color:#a0a8b8;margin-left:12px}.badge{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--r);border:1px solid var(--r);border-radius:20px;padding:4px 8px}button{background:#1a2030;color:white;border:1px solid #29303d;border-radius:9px;padding:9px;cursor:pointer;margin:4px}#history div{border-bottom:1px solid #29303d;padding:10px 0;font-size:13px}@media(max-width:500px){header{align-items:flex-start;gap:12px;flex-direction:column}}</style>    
</head><body><main><header><a href="dashboard.html"><b>ZYPHOR</b></a><nav><a href="halloween.html">Halloween cases</a> · <a href="trade.html">Trading</a> · <a href="dashboard.html">Dashboard</a></nav></header><section class="panel"><p class="muted">YOUR ACCOUNT INVENTORY</p><h1>My Collection</h1><p class="muted">Every item you discover across Zyphor boxes, all in one place.</p><div id="summary" class="muted">Loading…</div></section><section><h2>Items</h2><div id="filters"><button data-filter="all">All</button><button data-filter="rare">Rare</button><button data-filter="super-rare">Super Rare</button><button data-filter="epic">Epic</button><button data-filter="mythical">Mythical</button><button data-filter="legendary">Legendary</button><button data-filter="secret">Secret</button></div><div class="grid" id="items"><p class="muted">Loading…</p></div></section><section><h2>Recent openings</h2><div class="panel" id="history"><p class="muted">Loading…</p></div></section><p id="error" style="color:#ff8a8a"></p></main><script>const $=s=>document.querySelector(s),token=localStorage.getItem("Token")||"";let backend="",data=null,filter="all";const colors={rare:"#fbbf24","super-rare":"#60a5fa",epic:"#c084fc",mythical:"#fb7185",legendary:"#f97316",secret:"#ff3d81"};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function init(){if(!token){location.href="login.html";return}try{const sr=await fetch("/server.txt");backend=(await sr.text()).trim().replace(/\/+$/ ,"");const r=await fetch(backend+"/collection",{headers:{Authorization:token}}),d=await r.json();if(r.status===401){location.href="login.html";return}if(!r.ok)throw Error(d.error||"Could not load collection");data=d;render()}catch(e){$("#error").textContent=e.message;$("#items").innerHTML="Collection unavailable"}}function dateLabel(value){if(!value)return "Unknown";const d=new Date(value);return Number.isFinite(d.getTime())?d.toLocaleString():"Unknown"}
function renderCopyMetadata(copies){if(!Array.isArray(copies)||!copies.length)return '<p class="muted">Individual copy records unavailable from the collection response.</p>';return '<details class="copies"><summary>Individual copies ('+copies.length+')</summary>'+copies.map(c=>{const owners=Array.isArray(c.ownershipHistory)?c.ownershipHistory:[];const itemNo=c.openingNumber??c.itemOpeningNumber??c.openedNumber??c.openingIndex??c.openNumber??null;const globalNo=c.globalOpeningNumber??c.globalOpeningNo??c.globalOpenNumber??null;const number=itemNo!==null&&itemNo!==undefined?'Item opening #'+esc(itemNo)+(c.openingNumberExact===false?' (legacy estimate)':''):'Item opening number unavailable';return '<div class="copy"><div class="copyid">ID: '+esc(c.id||c.instanceId||c.copyId||'Unknown')+'</div><div>'+number+'</div>'+(globalNo!==null&&globalNo!==undefined?'<div><b>Global opening #'+esc(globalNo)+'</b></div>':'<div class="muted">Global opening number not provided by backend</div>')+'<div>Opened: '+esc(dateLabel(c.openedAt||c.opened_at||c.openingTime||c.openingTimestamp))+'</div>'+((c.openedBy||c.openedByUsername)?'<div>Originally opened by: '+esc(c.openedBy||c.openedByUsername)+'</div>':'')+(c.acquiredAt&&c.acquiredAt!==c.openedAt?'<div>Last acquired: '+esc(dateLabel(c.acquiredAt))+'</div>':'')+(owners.length?'<details><summary>Ownership history ('+owners.length+')</summary><div class="copyhistory">'+owners.map(h=>'<div>'+esc(h.username||'Unknown owner')+' · '+esc(h.event||'ownership')+' · '+esc(dateLabel(h.acquiredAt))+'</div>').join('')+'</div></details>':'')+'</div>'}).join('')+'</details>'}
function render(){const all=Object.values(data.items||{}),items=all.filter(x=>filter==="all"||x.rarity===filter).sort((a,b)=>(Object.keys(colors).indexOf(b.rarity)-Object.keys(colors).indexOf(a.rarity)));$("#summary").textContent=all.length+" unique items · "+all.reduce((n,x)=>n+Number(x.quantity||0),0)+" total items";$("#items").innerHTML=items.length?items.map(x=>'<article class="item" style="--r:'+esc(colors[x.rarity]||"#aaa")+'"><div class="icon">'+esc(x.icon||"📦")+'</div><h3>'+esc(x.name)+'</h3><span class="badge">'+esc(x.rarity||"item")+'</span><p class="muted">Quantity: ×'+Number(x.quantity||0)+'</p><p class="muted">Opened ever globally: '+Number(x.openedEver||0).toLocaleString()+'</p>'+renderCopyMetadata(x.copies)+'</article>').join(''):'<p class="muted">No items in this filter yet.</p>';const openings=data.openings||[];$("#history").innerHTML=openings.length?openings.slice(0,30).map(o=>{const item=(data.items||{})[o.itemId]||{};const copyId=o.instanceId||o.copyId;const itemNo=o.openingNumber??o.itemOpeningNumber??o.openedNumber??o.openingIndex??null;const globalNo=o.globalOpeningNumber??o.globalOpeningNo??o.globalOpenNumber??null;const identifier=copyId?'Copy ID '+copyId:(o.id?'Opening record '+o.id:'ID unavailable');return '<div>'+esc(item.icon||o.icon||"📦")+' '+esc(item.name||o.itemName||o.itemId)+' · <span style="color:'+esc(colors[o.rarity]||"#aaa")+'">'+esc(o.rarity||"item")+'</span><div class="muted">'+(itemNo!=null?'Item opening #'+esc(itemNo)+' · ':'')+(globalNo!=null?'<b>Global opening #'+esc(globalNo)+'</b> · ':'Global opening number unavailable · ')+esc(identifier)+' · '+esc(dateLabel(o.openedAt||o.opened_at||o.openingTime))+'</div></div>'}).join(''):'<p class="muted">No openings yet.</p>'}document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});init();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5179004241080538" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Zyphor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--accent:#8c5cff;--accent2:#36d9ff;--duration:900ms}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh;overflow:hidden}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;isolation:isolate;opacity:1}
.loading:before{content:"";position:absolute;inset:-50%;background:radial-gradient(ellipse at 50% 45%,rgba(93,40,190,.17),transparent 38%),radial-gradient(ellipse at 50% 58%,rgba(0,180,255,.09),transparent 45%);animation:ambient 5s ease-in-out infinite alternate;pointer-events:none}
.loading:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(255,255,255,.012) 4px);pointer-events:none;z-index:8}
.logo-stage{position:relative;width:min(90vw,720px,160vh);aspect-ratio:3/2;max-height:80vh;isolation:isolate;perspective:1000px;overflow:visible}
.logo-stage:before{content:"";position:absolute;inset:15%;border-radius:50%;background:radial-gradient(ellipse,rgba(105,55,255,.22),rgba(0,160,255,.08) 38%,transparent 70%);filter:blur(35px);animation:logoGlow 3s ease-in-out infinite alternate;pointer-events:none}
.logo-stage:after{content:"";position:absolute;inset:5%;border:1px solid rgba(151,111,255,.08);border-radius:50%;transform:scaleY(.38) rotate(-12deg);box-shadow:0 0 50px rgba(114,72,255,.06),inset 0 0 50px rgba(114,72,255,.04);animation:orbitRing 9s linear infinite;pointer-events:none}
.logo-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;clip-path:inset(0 0 100% 0);transform:scale(.82) rotateX(12deg);filter:blur(14px) brightness(1.8);pointer-events:none;will-change:clip-path,transform,filter,opacity}
.logo-layer img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;user-select:none;-webkit-user-drag:none}
.logo-layer.visible{opacity:1;clip-path:inset(0);transform:scale(1);filter:blur(0) brightness(1);animation:logoFloat 3s ease-in-out infinite}
.logo-layer.wipe{z-index:3;opacity:1;animation:cinematicReveal var(--duration) cubic-bezier(.16,1,.3,1) forwards}
.logo-layer.wipe:before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,transparent 0%,rgba(132,81,255,.03) 35%,rgba(100,208,255,.6) 49%,rgba(255,255,255,.95) 50%,rgba(124,88,255,.5) 51%,transparent 65%);background-size:100% 240%;background-position:0 0;mix-blend-mode:screen;animation:scanFlash var(--duration) cubic-bezier(.16,1,.3,1) forwards}
.logo-layer.wipe:after{content:"";position:absolute;inset:0;z-index:3;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 49%,rgba(109,195,255,.8) 50%,rgba(147,92,255,.5) 51%,transparent 65%);transform:translateX(-120%);mix-blend-mode:screen;animation:lightSweep var(--duration) cubic-bezier(.16,1,.3,1) forwards}
@keyframes cinematicReveal{0%{clip-path:inset(0 0 100% 0);transform:scale(.82) rotateX(16deg) translateY(35px);filter:blur(18px) brightness(2.4);opacity:0}18%{opacity:1}45%{filter:blur(2px) brightness(1.8)}72%{filter:blur(0) brightness(1.35)}100%{clip-path:inset(0);transform:scale(1) rotateX(0) translateY(0);filter:blur(0) brightness(1);opacity:1}}
@keyframes scanFlash{0%{background-position:0 -120%;opacity:0}30%{opacity:1}75%{opacity:.85}100%{background-position:0 120%;opacity:0}}
@keyframes lightSweep{0%{transform:translateX(-120%);opacity:0}25%{opacity:1}75%{opacity:.8}100%{transform:translateX(120%);opacity:0}}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.008)}}
@keyframes ambient{0%{transform:scale(.9) rotate(-5deg);opacity:.6}100%{transform:scale(1.12) rotate(5deg);opacity:1}}
@keyframes logoGlow{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.18);opacity:1}}
@keyframes orbitRing{from{transform:scaleY(.38) rotate(-12deg)}to{transform:scaleY(.38) rotate(348deg)}}
.loading.leaving{animation:screenExit .65s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
@keyframes screenExit{0%{opacity:1;transform:scale(1);filter:brightness(1)}45%{opacity:1;transform:scale(1.025);filter:brightness(1.8)}100%{opacity:0;transform:scale(1.09);filter:brightness(2.5)}}
.loading.leaving .logo-stage{animation:stageExit .65s cubic-bezier(.16,1,.3,1) forwards}
@keyframes stageExit{0%{transform:scale(1);filter:blur(0)}100%{transform:scale(.88);filter:blur(8px)}}
.progress{position:absolute;left:50%;top:calc(50% + min(29vw,220px));width:min(190px,45vw);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:13px;z-index:10}
.progress-track{height:2px;width:100%;background:rgba(255,255,255,.1);overflow:hidden;border-radius:20px;box-shadow:0 0 15px rgba(140,92,255,.12)}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2),#fff);box-shadow:0 0 12px rgba(95,175,255,.8);border-radius:20px;transition:width .3s ease-out}
.progress-text{font-size:10px;font-weight:600;letter-spacing:4px;color:rgba(255,255,255,.58);text-transform:uppercase;white-space:nowrap}
.progress-text span{display:inline-block;min-width:27px;color:#fff;letter-spacing:1px;text-align:right}
.corner{position:absolute;width:20px;height:20px;border-color:rgba(150,120,255,.32);border-style:solid;opacity:0;animation:cornerIn .6s .4s ease forwards}
.corner.tl{top:8%;left:8%;border-width:1px 0 0 1px}
.corner.tr{top:8%;right:8%;border-width:1px 1px 0 0}
.corner.bl{bottom:8%;left:8%;border-width:0 0 1px 1px}
.corner.br{bottom:8%;right:8%;border-width:0 1px 1px 0}
@keyframes cornerIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.particle-field{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
.particle{position:absolute;width:2px;height:2px;border-radius:50%;background:#b9a5ff;box-shadow:0 0 8px 2px rgba(140,92,255,.55);opacity:0;animation:particleRise var(--time) linear var(--delay) infinite}
@keyframes particleRise{0%{transform:translate3d(0,25px,0) scale(.4);opacity:0}15%{opacity:.8}75%{opacity:.5}100%{transform:translate3d(var(--drift),-100px,0) scale(1.3);opacity:0}}
@media(max-width:600px){.logo-stage{width:92vw;max-height:65vh}.progress{top:calc(50% + min(34vw,180px));width:min(165px,44vw);gap:11px}.progress-text{font-size:9px;letter-spacing:3px}.corner{width:14px;height:14px}}
@media(max-height:500px){.logo-stage{width:min(65vw,95vh);max-height:75vh}.progress{top:auto;bottom:8vh}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="loading" id="loadingScreen">
    <div class="particle-field" id="particleField"></div>
    <div class="logo-stage">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="logo-layer" id="loadOne"><img src="Load1.png" alt=""></div>
        <div class="logo-layer" id="loadTwo"><img src="Load2.png" alt=""></div>
        <div class="logo-layer" id="mainLogo"><img src="Logo1.png" alt=""></div>
    </div>
    <div class="progress">
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">Initializing <span id="progressNumber">0%</span></div>
    </div>
</div>
<script>
(function(){
    const screen=document.getElementById("loadingScreen");
    const loadOne=document.getElementById("loadOne");
    const loadTwo=document.getElementById("loadTwo");
    const mainLogo=document.getElementById("mainLogo");
    const progressBar=document.getElementById("progressBar");
    const progressText=document.getElementById("progressText");
    const progressNumber=document.getElementById("progressNumber");
    const particleField=document.getElementById("particleField");
    const phone=localStorage.getItem("Phone");
    const destination="https://zyphor.cc/"+(phone==="1"?"1dashboard.html":"0dashboard.html");
    const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let finished=false;

    function createParticles(){
        if(reducedMotion)return;
        const count=window.innerWidth<600?18:38;
        const fragment=document.createDocumentFragment();
        for(let i=0;i<count;i++){
            const particle=document.createElement("i");
            particle.className="particle";
            particle.style.left=(Math.random()*100)+"%";
            particle.style.top=(30+Math.random()*70)+"%";
            particle.style.setProperty("--delay",-(Math.random()*8)+"s");
            particle.style.setProperty("--time",(5+Math.random()*7)+"s");
            particle.style.setProperty("--drift",((Math.random()-.5)*100)+"px");
            fragment.appendChild(particle);
        }
        particleField.appendChild(fragment);
    }

    function setProgress(value,label){
        const percent=Math.max(0,Math.min(100,Math.round(value)));
        progressBar.style.width=percent+"%";
        progressNumber.textContent=percent+"%";
        if(label)progressText.firstChild.textContent=label+" ";
    }

    function reveal(from,to){
        return new Promise(resolve=>{
            from.className="logo-layer";
            to.className="logo-layer wipe";
            let done=false;
            const finish=()=>{
                if(done)return;
                done=true;
                to.className="logo-layer visible";
                resolve();
            };
            to.addEventListener("animationend",finish,{once:true});
            setTimeout(finish,1050);
        });
    }

    async function runAnimation(){
        loadOne.className="logo-layer visible";
        setProgress(3,"Initializing");
        await new Promise(resolve=>setTimeout(resolve,250));
        if(finished)return;
        setProgress(12,"Initializing");
        await new Promise(resolve=>setTimeout(resolve,250));
        if(finished)return;
        await reveal(loadOne,loadTwo);
        if(finished)return;
        setProgress(43,"Loading systems");
        await new Promise(resolve=>setTimeout(resolve,250));
        if(finished)return;
        setProgress(58,"Loading systems");
        await reveal(loadTwo,mainLogo);
        if(finished)return;
        setProgress(88,"Preparing dashboard");
        await new Promise(resolve=>setTimeout(resolve,350));
        if(finished)return;
        setProgress(100,"Welcome to Zyphor");
        await new Promise(resolve=>setTimeout(resolve,350));
        if(finished)return;
        finished=true;
        screen.classList.add("leaving");
        setTimeout(()=>window.location.replace(destination),600);
    }

    createParticles();

    if(reducedMotion){
        loadOne.className="logo-layer";
        mainLogo.className="logo-layer visible";
        setProgress(100,"Welcome to Zyphor");
        setTimeout(()=>window.location.replace(destination),250);
        return;
    }

    runAnimation();

    window.addEventListener("pageshow",function(event){
        if(event.persisted)window.location.replace(destination);
    });
})();
</script>
</body>
</html>

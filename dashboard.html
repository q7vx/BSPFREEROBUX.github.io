<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Zyphor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh;overflow:hidden}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;isolation:isolate}
.loading:before{content:"";position:absolute;inset:-35%;background:radial-gradient(ellipse at center,rgba(105,55,255,.18),rgba(0,150,255,.07) 36%,transparent 65%);animation:ambient 5s ease-in-out infinite alternate;pointer-events:none}
.stage{position:relative;width:min(90vw,720px,160vh);aspect-ratio:3/2;max-height:80vh;display:flex;align-items:center;justify-content:center}
.logo{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.94);filter:blur(8px) brightness(1.5);animation:logoIn 1s cubic-bezier(.16,1,.3,1) forwards,logoFloat 4s 1s ease-in-out infinite;user-select:none;-webkit-user-drag:none}
.stage:before{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(115,76,255,.18),transparent 70%);filter:blur(28px);animation:glow 3s ease-in-out infinite alternate;pointer-events:none}
.loader{position:absolute;left:50%;top:calc(50% + min(30vw,220px));width:min(220px,56vw);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:14px}
.track{height:3px;width:100%;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:0 0 20px rgba(140,92,255,.12)}
.bar{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#7950ff,#40cfff,#fff);box-shadow:0 0 14px rgba(100,170,255,.85);transition:width .25s ease}
.status{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px;font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.58)}
#percent{color:#fff;letter-spacing:1px;font-variant-numeric:tabular-nums}
@keyframes logoIn{0%{opacity:0;transform:scale(.88);filter:blur(16px) brightness(2)}55%{opacity:1;filter:blur(0) brightness(1.3)}100%{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.006)}}
@keyframes ambient{0%{transform:scale(.9) rotate(-4deg);opacity:.55}100%{transform:scale(1.12) rotate(4deg);opacity:1}}
@keyframes glow{0%{transform:scale(.85);opacity:.45}100%{transform:scale(1.15);opacity:1}}
@media(max-width:600px){.stage{width:92vw;max-height:65vh}.loader{top:calc(50% + min(34vw,180px));width:min(190px,56vw)}.status{font-size:9px;letter-spacing:2px}}
@media(max-height:500px){.stage{width:min(65vw,95vh);max-height:74vh}.loader{top:auto;bottom:7vh}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="loading" aria-label="Loading Zyphor">
    <div class="stage">
        <img class="logo" id="logo" src="Logo1.png" alt="Zyphor">
    </div>
    <section class="loader" aria-live="polite">
        <div class="track"><div class="bar" id="bar"></div></div>
        <div class="status"><span id="status">Starting Zyphor</span><span id="percent">0%</span></div>
    </section>
</main>
<script>
(function(){
    const bar=document.getElementById("bar");
    const status=document.getElementById("status");
    const percent=document.getElementById("percent");
    const logo=document.getElementById("logo");
    const storage={
        token:localStorage.getItem("Token"),
        username:localStorage.getItem("username"),
        phone:localStorage.getItem("Phone")==="1"
    };
    const destination="https://zyphor.cc/"+(storage.phone?"1dashboard.html":"0dashboard.html");
    let progress=0;
    let redirected=false;

    function update(value,message){
        progress=Math.max(progress,Math.min(100,value));
        bar.style.width=progress+"%";
        percent.textContent=Math.round(progress)+"%";
        status.textContent=message;
    }

    function preloadImage(src){
        return new Promise(resolve=>{
            const image=new Image();
            image.onload=()=>resolve(true);
            image.onerror=()=>resolve(false);
            image.src=src;
            if(image.complete)resolve(image.naturalWidth>0);
        });
    }

    function preloadPage(url){
        return new Promise(resolve=>{
            const link=document.createElement("link");
            link.rel="prefetch";
            link.href=url;
            link.as="document";
            link.onload=()=>resolve(true);
            link.onerror=()=>resolve(false);
            document.head.appendChild(link);
            setTimeout(()=>resolve(false),1800);
        });
    }

    async function run(){
        update(12,"Loading logo");
        await preloadImage("Logo1.png");
        update(32,"Checking session");

        if(!storage.token){
            update(100,"Session required");
            setTimeout(()=>window.location.replace("https://zyphor.cc/login.html"),450);
            return;
        }

        update(48,"Checking username");
        if(!storage.username){
            update(100,"Login required");
            setTimeout(()=>window.location.replace("https://zyphor.cc/login.html"),450);
            return;
        }

        update(66,"Preparing dashboard");
        const imagePromise=preloadImage("Logo1.png");
        const pagePromise=preloadPage(destination);
        await imagePromise;
        update(82,"Preloading dashboard");
        await pagePromise;
        update(100,"Ready");
        await new Promise(resolve=>setTimeout(resolve,250));

        if(!redirected){
            redirected=true;
            window.location.replace(destination);
        }
    }

    logo.addEventListener("error",function(){
        logo.style.visibility="hidden";
    });

    run().catch(function(){
        window.location.replace(destination);
    });
})();
</script>
</body>
</html>

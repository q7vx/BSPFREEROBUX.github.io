<style>

.info{flex:1;min-width:0}.name{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{margin-top:4px;color:#96a1b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.unread{background:#5f62ff}.pinBtn{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.06);color:#9eabc0;font-size:16px;flex:0 0 auto}.pinBtn.pinned{color:#00d5ff;background:rgba(0,213,255,.11)}

.messages{flex:1;overflow:auto;padding:16px 12px 24px}.row{display:flex;margin-bottom:10px}.me{justify-content:flex-end}.bubble{max-width:min(82%,620px);padding:11px 13px;border-radius:18px;background:#202737;line-height:1.45;font-size:14px;word-break:break-word;box-shadow:0 4px 18px rgba(0,0,0,.12)}.me .bubble{background:linear-gradient(135deg,#5263f4,#7958e8)}.bubble img{width:100%;border-radius:12px;margin-top:9px;display:block}.time{margin-top:5px;font-size:10px;opacity:.58}.receipt{font-size:10px;opacity:.65;margin-top:4px}

.roleBadge{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:20px;height:20px;padding:0;border:1px solid transparent;border-radius:7px;font-family:inherit;font-size:10px;font-weight:900;line-height:1;vertical-align:middle;cursor:help;transition:transform .16s ease,filter .16s ease}.roleBadge:hover,.roleBadge:focus-visible{filter:brightness(1.18);transform:translateY(-1px);outline:2px solid rgba(255,255,255,.18);outline-offset:1px}.roleAdministrator{border-color:rgba(245,196,81,.34);background:rgba(245,196,81,.12);color:#f5c451}.roleSupport{border-color:rgba(82,217,255,.3);background:rgba(82,217,255,.1);color:#52d9ff}.roleModerator{border-color:rgba(112,223,160,.3);background:rgba(112,223,160,.1);color:#70dfa0}.roleBetaTester{border-color:rgba(182,154,255,.3);background:rgba(182,154,255,.1);color:#c4adff}.roleStaff{border-color:rgba(82,217,255,.28);background:rgba(82,217,255,.09);color:#72e4ff}.roleOther{width:auto;padding:2px 6px;font-size:9px}.nameLine .roleBadge{width:18px;height:18px}.msgRoleBadge{width:15px;height:15px;margin-left:4px;font-size:8px;vertical-align:middle}.chatRoleBadges{display:inline-flex;align-items:center;gap:5px;min-width:0;flex-wrap:wrap}
.avatar{overflow:hidden;isolation:isolate}.avatarInitial{position:relative;z-index:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:inherit}.avatarImage{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}.online{z-index:2}.chatAvatar{width:39px;height:39px;flex:0 0 39px;font-size:14px}.chatIdentity{flex:1;min-width:0}.chatNameLine{display:flex;align-items:center;gap:7px;min-width:0}.chatNameLine .chatName{flex:0 1 auto;max-width:52vw}.messageAvatar{position:relative;width:28px;height:28px;flex:0 0 28px;align-self:flex-end;overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:50%;background:#171b28;font-size:10px}.messageAvatar .avatarImage{pointer-events:none}.row{align-items:flex-end;gap:7px}.bubble{min-width:0}.bubbleStaff{display:inline-flex;align-items:center;justify-content:center;margin-left:5px;width:15px;height:15px;border:1px solid rgba(82,217,255,.25);border-radius:5px;background:rgba(82,217,255,.08);color:#72e4ff;font-size:9px;font-weight:900;vertical-align:middle}
.nameLine{display:flex;align-items:center;gap:7px;min-width:0}

.olderMessagesButton:disabled{opacity:.55}

.appFooter a{color:#a99ad8;text-decoration:none}.appFooter a:hover{color:#d2c5ff;text-decoration:underline}.appFooter strong{color:#9ba5ba;font-weight:700}

<body>
<div id="app">
<div class="header">
<div class="topbar"><div class="title">Messages</div><button class="home" onclick="location.href='dashboard.html'">⌂</button></div>
<div class="search"><input id="searchUser" placeholder="Search username"><button id="addFriendBtn">+</button></div>
<div class="requests" id="requestsButton"><span>Friend Requests</span><div class="badge" id="requestCount">0</div></div>
<div id="requestList"></div>
</div>
<div class="friendList" id="friendList"></div>
<footer class="appFooter"><span>© <span id="copyrightYear"></span> Zyphor.cc</span><span>·</span><a href="tos.html">Terms of Service</a><a href="pp.html">Privacy Policy</a><span>·</span><span>Made by <strong>Team Vaprix</strong></span></footer>
</div>

<div class="chat" id="chat">
<div class="chatHeader"><button class="back" id="backButton">←</button><div class="avatar chatAvatar" id="chatAvatar"><span class="avatarInitial" id="chatAvatarInitial">?</span><img class="avatarImage" id="chatAvatarImage" alt="" hidden></div><div class="chatIdentity"><div class="chatNameLine"><div class="chatName" id="chatTitle">Select a friend</div><span class="chatRoleBadges" id="chatRoleBadges"></span></div></div><button class="back" onclick="location.href='dashboard.html'">⌂</button></div>
<div class="messages" id="messages"></div>

<input type="file" id="imagePicker" accept="image/*" multiple hidden>
<label for="imagePicker" class="circle">📷</label>
<textarea id="messageBox" placeholder="Message"></textarea>
<button class="circle send" id="sendBtn">➤</button>
</div>
</div>

<script>
let backend=null,token=null,myName="",state={friends:[],chats:[],incomingRequests:[],friendBadges:{},pinnedDms:[]},activeFriend="",lastChatJSON="",pinnedFriends=[],loadedMessages=[],chatPageCursor=null,chatHasMore=false,loadingOlder=false
const friendList=document.getElementById("friendList"),requestList=document.getElementById("requestList"),requestCount=document.getElementById("requestCount"),chat=document.getElementById("chat"),chatTitle=document.getElementById("chatTitle"),chatRoleBadges=document.getElementById("chatRoleBadges"),chatAvatarImage=document.getElementById("chatAvatarImage"),chatAvatarInitial=document.getElementById("chatAvatarInitial"),messages=document.getElementById("messages"),messageBox=document.getElementById("messageBox"),imagePicker=document.getElementById("imagePicker"),sendBtn=document.getElementById("sendBtn"),searchUser=document.getElementById("searchUser"),addFriendBtn=document.getElementById("addFriendBtn"),backButton=document.getElementById("backButton")
document.getElementById("copyrightYear").textContent=String(new Date().getFullYear())
function getPinned(){return pinnedFriends}
function setPinned(list){pinnedFriends=[...new Set(Array.isArray(list)?list:[])];try{localStorage.setItem("zyphorPinnedDMs",JSON.stringify(pinnedFriends))}catch{}}
function isPinned(friend){return getPinned().includes(friend)}
function profilePictureUrl(name){const base=String(backend||"").replace(/\/+$/g,"");return base&&name?base+"/account/pfp/"+encodeURIComponent(String(name))+"?v=1":""}
function avatarMarkup(name,online=false){const src=profilePictureUrl(name);return `<div class="avatar"><span class="avatarInitial">${escapeHTML(String(name||"?").charAt(0).toUpperCase())}</span>${src?`<img class="avatarImage" src="${escapeHTML(src)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:""}${online?'<div class="online"></div>':""}</div>`}
function makeMessageAvatar(name){const el=document.createElement("div");el.className="messageAvatar";el.innerHTML=avatarMarkup(name).replace(/^<div class="avatar">/,'').replace(/<\/div>$/,'');return el}
function setChatAvatar(name){chatAvatarInitial.textContent=String(name||"?").charAt(0).toUpperCase();chatAvatarImage.hidden=true;chatAvatarImage.removeAttribute("src");const src=profilePictureUrl(name);if(src){chatAvatarImage.onload=()=>{chatAvatarImage.hidden=false};chatAvatarImage.onerror=()=>{chatAvatarImage.hidden=true};chatAvatarImage.src=src;chatAvatarImage.hidden=false}}
const ZYPHOR_ROLE_BADGES={"Administrator":{icon:"👑",className:"roleAdministrator",title:"Zyphor Administrator",description:"This user has the Administrator staff role."},"Support":{icon:"🎧",className:"roleSupport",title:"Zyphor Support",description:"This user has the Support staff role."},"Moderator":{icon:"🛡️",className:"roleModerator",title:"Zyphor Moderator",description:"This user has the Moderator staff role."},"Beta Tester":{icon:"🧪",className:"roleBetaTester",title:"Zyphor Beta Tester",description:"This user has the Beta Tester role."},"Staff":{icon:"✦",className:"roleStaff",title:"Zyphor Staff",description:"Legacy staff badge. Deploy the updated backend to show the exact role."}};
function roleBadgeInfo(name){return ZYPHOR_ROLE_BADGES[name]||{icon:String(name||"•"),className:"roleOther",title:String(name||"Badge"),description:"Zyphor badge: "+String(name||"Badge")}}
function showRoleInfo(name){const meta=roleBadgeInfo(name);alert(meta.title+"\n\n"+meta.description)}
function badgeMarkup(b,small=false){const name=String(b?.name||"Badge"),meta=roleBadgeInfo(name);return `<button type="button" class="roleBadge ${meta.className}${small?" msgRoleBadge":""}" title="${escapeHTML(meta.title)}" aria-label="${escapeHTML(meta.title)}" data-role="${escapeHTML(name)}" onclick="event.stopPropagation();showRoleInfo(this.dataset.role)">${meta.icon}</button>`}
async function syncPinned(){try{const r=await api("/dms/pinned",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pinnedDms:pinnedFriends})});const data=await safeJson(r);if(!data?.success)throw new Error(data?.error||"sync_failed");setPinned(data.pinnedDms||[]);renderFriends()}catch{alert("Pinned conversations could not be synced with the server.")}}
function togglePin(friend,event){event.stopPropagation();let pins=getPinned();pins=pins.includes(friend)?pins.filter(x=>x!==friend):[friend,...pins];setPinned(pins);renderFriends();syncPinned()}
async function getBackend(){const r=await fetch("server.txt");return(await r.text()).trim()}
async function safeJson(r){const t=await r.text();try{return JSON.parse(t)}catch{return null}}
async function api(path,options={}){const headers=new Headers(options.headers||{});headers.set("Authorization",localStorage.getItem("Token"));return fetch(backend+path,{...options,headers})}
async function trackPage(page){if(!localStorage.getItem("Token"))return;await fetch(backend+"/track/page",{method:"POST",headers:{"Content-Type":"application/json",Authorization:localStorage.getItem("Token")},body:JSON.stringify({page})})}
async function refreshState(){const r=await api("/dms/state"),data=await safeJson(r);if(!data)return;state=data;state.friends||=[];state.chats||=[];state.incomingRequests||=[];state.friendBadges||={};setPinned(Array.isArray(data.pinnedDms)?data.pinnedDms:(pinnedFriends.length?pinnedFriends:[]));renderRequests();renderFriends();if(activeFriend)await openChat(activeFriend,false)}
function renderRequests(){requestCount.textContent=state.incomingRequests.length;requestList.innerHTML="";if(!state.incomingRequests.length){requestList.style.display="none";return}requestList.style.display="block";state.incomingRequests.forEach(r=>{const d=document.createElement("div");d.className="friend";d.innerHTML=`${avatarMarkup(r.from)}<div class="info"><div class="name">${escapeHTML(r.from)}</div><div class="preview">Friend request</div></div><div class="requestActions"><button class="mini accept">✓</button><button class="mini decline">✕</button></div>`;d.querySelector(".accept").onclick=e=>{e.stopPropagation();acceptRequest(r.id,r.from)};d.querySelector(".decline").onclick=e=>{e.stopPropagation();declineRequest(r.id)};requestList.appendChild(d)})}
function renderFriends(){
    friendList.innerHTML=""
    if(!state.friends.length){friendList.innerHTML=`<div class="empty"><strong>No friends yet</strong>Search for a username above to start messaging.</div>`;return}
    const pins=getPinned()
    const sorted=[...state.friends].sort((a,b)=>{
        const ap=pins.includes(a),bp=pins.includes(b)
        if(ap!==bp)return ap?-1:1
        const aa=state.chats.find(c=>c.with===a)||{},bb=state.chats.find(c=>c.with===b)||{}
        const time= new Date(bb.lastTime||0)-new Date(aa.lastTime||0)
        return time || (Number(bb.unread||0)-Number(aa.unread||0)) || a.localeCompare(b)
    })
    let shownPinned=false,shownOthers=false
    sorted.forEach(friend=>{
        const pinned=pins.includes(friend)
        if(pinned&&!shownPinned){friendList.insertAdjacentHTML("beforeend",`<div class="sectionLabel">Pinned</div>`);shownPinned=true}
        if(!pinned&&!shownOthers){friendList.insertAdjacentHTML("beforeend",`<div class="sectionLabel">Messages</div>`);shownOthers=true}
        const c=state.chats.find(x=>x.with===friend)||{}
        const d=document.createElement("div")
        d.className="friend"+(pinned?" pinned":"")
        const badges=Array.isArray(state.friendBadges?.[friend])?state.friendBadges[friend]:[]
        const badgesMarkup=badges.map(b=>badgeMarkup(b)).join("")
        d.innerHTML=`${avatarMarkup(friend,true)}<div class="info"><div class="nameLine"><div class="name">${escapeHTML(friend)}</div>${badgesMarkup}</div><div class="preview">${c.lastAuthor?escapeHTML(c.lastAuthor+": "+(c.lastMessage||"")):"No messages yet"}</div></div>${c.unread?`<div class="unread">${c.unread>99?"99+":c.unread}</div>`:""}<button class="pinBtn ${pinned?"pinned":""}" title="${pinned?"Unpin conversation":"Pin conversation"}" aria-label="${pinned?"Unpin":"Pin"}">${pinned?"★":"☆"}</button>`
        d.onclick=()=>openChat(friend)
        d.querySelector(".pinBtn").onclick=e=>togglePin(friend,e)
        friendList.appendChild(d)
    })
}
async function openChat(friend,markSeen=true){
    const sameConversation=activeFriend===friend
    const previousMessages=sameConversation?loadedMessages.slice():[]
    const previousCursor=chatPageCursor
    const previouslyHadOlder=chatHasMore
    const r=await api("/dms/chat?with="+encodeURIComponent(friend)+"&limit=50")
    const data=await safeJson(r)
    if(!data||data.error){if(data?.error)alert(data.error);return}
    activeFriend=friend
    chat.style.display="flex"
    chatTitle.textContent=friend
    const activeBadges=state.friendBadges?.[friend]||[]
    chatRoleBadges.innerHTML=activeBadges.map(b=>badgeMarkup(b)).join("")
    setChatAvatar(friend)
    const pageMessages=Array.isArray(data.chat.messages)?data.chat.messages:[]
    if(sameConversation&&previousMessages.length){
        const merged=new Map()
        for(const m of [...pageMessages,...previousMessages])merged.set(m.messageId||`${m.time}|${m.author}|${m.text}`,m)
        loadedMessages=[...merged.values()].sort((a,b)=>new Date(a.time||0)-new Date(b.time||0))
        chatHasMore=previouslyHadOlder?true:!!data.chat.hasMore
        chatPageCursor=previouslyHadOlder?previousCursor:(data.chat.nextBefore||null)
    }else{
        loadedMessages=pageMessages
        chatHasMore=!!data.chat.hasMore
        chatPageCursor=data.chat.nextBefore||null
    }
    data.chat.messages=loadedMessages
    data.chat.hasMore=chatHasMore
    data.chat.nextBefore=chatPageCursor
    data.chat.totalMessages=Number(data.chat.totalMessages??data.chat.messageCount??loadedMessages.length)
    const j=JSON.stringify(data.chat)
    if(j!==lastChatJSON){lastChatJSON=j;renderMessages(data.chat)}
    if(markSeen)await api("/dms/seen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chatId:friend})})
}
function escapeHTML(t){return String(t??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function formatTime(t){try{return new Date(t).toLocaleString()}catch{return""}}
function renderMessages(data){
    const previousTop=messages.scrollTop
    const previousHeight=messages.scrollHeight
    const wasNearBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<120
    messages.innerHTML=""
    if(data.hasMore){
        const older=document.createElement("button")
        older.className="olderMessagesButton"
        older.textContent=loadingOlder?"Loading older messages…":"↑ Load older messages"
        older.disabled=loadingOlder
        older.onclick=loadOlderMessages
        messages.appendChild(older)
    }
    if(!data.messages.length){
        const empty=document.createElement("div");empty.className="empty";empty.innerHTML="<strong>No messages yet</strong>Say hello.";messages.appendChild(empty);return
    }
    data.messages.forEach(m=>{
        const me=m.author===myName,row=document.createElement("div")
        row.className="row "+(me?"me":"them")
        const authorName=m.author||"Unknown"
        const avatar=document.createElement("div");avatar.className="messageAvatar"
        avatar.innerHTML=`<span class="avatarInitial">${escapeHTML(authorName.charAt(0).toUpperCase())}</span>${profilePictureUrl(authorName)?`<img class="avatarImage" src="${escapeHTML(profilePictureUrl(authorName))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:""}`
        const bubble=document.createElement("div");bubble.className="bubble"
        if(!me){const author=document.createElement("div");author.style.cssText="font-size:11px;opacity:.78;margin-bottom:4px";author.textContent=authorName;for(const badge of (state.friendBadges?.[authorName]||[])){const holder=document.createElement("span");holder.innerHTML=badgeMarkup(badge,true);author.appendChild(holder.firstElementChild)}bubble.appendChild(author)}
        if(m.text){const text=document.createElement("div");text.textContent=m.text;bubble.appendChild(text)}
        for(const imgData of (m.images||[])){const img=document.createElement("img");img.src=backend+imgData.url;img.loading="lazy";img.alt=imgData.originalName||"Image attachment";img.onclick=()=>window.open(backend+imgData.url,"_blank","noopener");bubble.appendChild(img)}
        const time=document.createElement("div");time.className="time";time.textContent=formatTime(m.time);bubble.appendChild(time)
        if(me){const receipt=document.createElement("div");receipt.className="receipt";const other=data.users?.find(u=>u!==myName);receipt.textContent=data.lastRead?.[other]&&new Date(data.lastRead[other])>=new Date(m.time)?"✓ Read":"✓ Sent";bubble.appendChild(receipt)}
        if(me){row.append(bubble,avatar)}else{row.append(avatar,bubble)}messages.appendChild(row)
    })
    requestAnimationFrame(()=>{if(wasNearBottom)messages.scrollTop=messages.scrollHeight;else if(previousHeight>0)messages.scrollTop=previousTop+Math.max(0,messages.scrollHeight-previousHeight)})
}
async function loadOlderMessages(){
    if(!activeFriend||!chatHasMore||!chatPageCursor||loadingOlder)return
    loadingOlder=true
    const friend=activeFriend,before=chatPageCursor,oldHeight=messages.scrollHeight,oldTop=messages.scrollTop
    try{
        const r=await api(`/dms/chat?with=${encodeURIComponent(friend)}&limit=50&before=${encodeURIComponent(before)}`)
        const data=await safeJson(r)
        if(!data?.chat||data.error||activeFriend!==friend)return
        const combined=new Map()
        for(const m of [...(data.chat.messages||[]),...loadedMessages])combined.set(m.messageId||`${m.time}|${m.author}|${m.text}`,m)
        loadedMessages=[...combined.values()].sort((a,b)=>new Date(a.time||0)-new Date(b.time||0))
        chatHasMore=!!data.chat.hasMore
        chatPageCursor=data.chat.nextBefore||null
        data.chat.messages=loadedMessages;data.chat.hasMore=chatHasMore;data.chat.nextBefore=chatPageCursor;data.chat.totalMessages=Number(data.chat.totalMessages??loadedMessages.length)
        lastChatJSON=JSON.stringify(data.chat)
        loadingOlder=false
        renderMessages(data.chat)
        requestAnimationFrame(()=>{messages.scrollTop=Math.max(0,messages.scrollHeight-oldHeight+oldTop)})
    }catch{}
    finally{loadingOlder=false}
}
messages.addEventListener("scroll",()=>{if(messages.scrollTop<45&&chatHasMore)loadOlderMessages()})
async function sendMessage(){if(!activeFriend)return;const text=messageBox.value.trim();if(!text&&!imagePicker.files.length)return;const form=new FormData();form.append("chatId",activeFriend);form.append("message",text);for(const f of imagePicker.files)form.append("images",f);const r=await api("/dms/send",{method:"POST",body:form}),data=await safeJson(r);if(!data)return;if(data.error){alert(data.error);return}messageBox.value="";imagePicker.value="";await openChat(activeFriend,false);await refreshState()}
sendBtn.onclick=sendMessage
messageBox.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}})
backButton.onclick=()=>{chat.style.display="none";activeFriend="";lastChatJSON="";loadedMessages=[];chatPageCursor=null;chatHasMore=false;loadingOlder=false}
addFriendBtn.onclick=addFriend
searchUser.addEventListener("keydown",e=>{if(e.key==="Enter")addFriend()})
async function addFriend(){const username=searchUser.value.trim();if(!username)return;const r=await api("/friends/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})}),data=await safeJson(r);if(!data)return;if(data.success){searchUser.value="";refreshState();return}alert(data.error)}
async function acceptRequest(requestId,from){const r=await api("/friends/accept",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requestId})}),data=await safeJson(r);if(!data)return;await refreshState();openChat(from)}
async function declineRequest(requestId){await api("/friends/decline",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requestId})});refreshState()}
setInterval(async()=>{await refreshState();if(activeFriend)await api("/dms/seen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chatId:activeFriend})})},2500)
async function init(){try{pinnedFriends=JSON.parse(localStorage.getItem("zyphorPinnedDMs")||"[]")}catch{pinnedFriends=[]}backend=await getBackend();token=localStorage.getItem("Token");await trackPage("1dms.html");if(!token){location.href="login.html";return}const r=await api("/me"),me=await safeJson(r);if(!me){location.href="login.html";return}myName=me.username;await refreshState();const f=decodeURIComponent(location.hash.substring(1)).trim();if(f){const found=state.friends.find(x=>x.toLowerCase()===f.toLowerCase());if(found)openChat(found,true)}}
init()
</script>

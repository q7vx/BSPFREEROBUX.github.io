<div class="topbar"><div class="brandBlock"><div class="brandMark" aria-hidden="true">Z</div><div class="headingWrap"><div class="eyebrow">ZYPHOR / CONNECT</div><div class="title">Messages</div><div class="subtitle">Your conversations, all in one place.</div></div></div><div class="headActions"><button class="iconButton" type="button" aria-label="Open dashboard" title="Dashboard" onclick="location.href='dashboard.html'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button></div></div>
<div class="searchRow search"><label class="searchField"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="searchUser" type="text" placeholder="Find a username" autocomplete="off" aria-label="Search for a user"></label><button class="primaryButton" id="addFriendBtn" type="button" aria-label="Send friend request"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="buttonText">Add friend</span></button></div>
<button class="requests" id="requestsButton" type="button" aria-expanded="false" aria-controls="requestList"><span class="requestLabel"><span class="requestIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3.5"/><path d="M17 11a3.5 3.5 0 0 0 0-7M17 14.5a4 4 0 0 1 4 4V20"/></svg></span>Friend requests</span><span class="badge" id="requestCount">0</span></button>
<div id="requestList" hidden></div>
</header>
<main class="content"><div class="friendList" id="friendList" aria-live="polite"></div></main>
<footer class="appFooter"><span>© <span id="copyrightYear"></span> Zyphor.cc</span><span aria-hidden="true">·</span><a href="tos.html">Terms</a><a href="pp.html">Privacy</a><span aria-hidden="true">·</span><span>Made by <strong>Team Vaprix</strong></span></footer>
</div>
<div class="chat" id="chat" aria-label="Conversation">
<header class="chatHeader"><button class="iconButton back" id="backButton" type="button" aria-label="Back to conversations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"/></svg></button><div class="avatar chatAvatar" id="chatAvatar"><span class="avatarInitial" id="chatAvatarInitial">?</span><img class="avatarImage" id="chatAvatarImage" alt="" hidden></div><div class="chatIdentity"><div class="chatNameLine"><div class="chatName" id="chatTitle">Select a friend</div><span class="chatRoleBadges" id="chatRoleBadges"></span></div><div class="chatState" id="chatState">Private conversation</div></div><button class="iconButton" type="button" aria-label="Open dashboard" title="Dashboard" onclick="location.href='dashboard.html'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button></header>
<div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div>
<form class="composer" id="composerForm">
<input type="file" id="imagePicker" accept="image/*" multiple hidden>
<label for="imagePicker" class="circle" title="Attach images" aria-label="Attach images"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></label>
<textarea id="messageBox" placeholder="Write a message…" aria-label="Write a message" rows="1"></textarea>
<button class="circle send" id="sendBtn" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg></button>
</form>
</div>
<script>
let backend=null,token=null,myName="",state={friends:[],chats:[],incomingRequests:[],friendBadges:{},pinnedDms:[]},activeFriend="",lastChatJSON="",pinnedFriends=[],loadedMessages=[],chatPageCursor=null,chatHasMore=false,loadingOlder=false
const friendList=document.getElementById("friendList"),requestList=document.getElementById("requestList"),requestCount=document.getElementById("requestCount"),requestsButton=document.getElementById("requestsButton"),chat=document.getElementById("chat"),chatTitle=document.getElementById("chatTitle"),chatRoleBadges=document.getElementById("chatRoleBadges"),chatAvatarImage=document.getElementById("chatAvatarImage"),chatAvatarInitial=document.getElementById("chatAvatarInitial"),chatState=document.getElementById("chatState"),messages=document.getElementById("messages"),messageBox=document.getElementById("messageBox"),imagePicker=document.getElementById("imagePicker"),sendBtn=document.getElementById("sendBtn"),searchUser=document.getElementById("searchUser"),addFriendBtn=document.getElementById("addFriendBtn"),backButton=document.getElementById("backButton"),composerForm=document.getElementById("composerForm")
document.getElementById("copyrightYear").textContent=String(new Date().getFullYear())
function applySeason(){const d=new Date();document.documentElement.classList.toggle("october-theme",d.getMonth()===9)}
applySeason()
function getPinned(){return pinnedFriends}
function setPinned(list){pinnedFriends=[...new Set(Array.isArray(list)?list:[])];try{localStorage.setItem("zyphorPinnedDMs",JSON.stringify(pinnedFriends))}catch{}}
function isPinned(friend){return getPinned().includes(friend)}
function profilePictureUrl(name){const base=String(backend||"").replace(/\/+$/g,"");return base&&name?base+"/account/pfp/"+encodeURIComponent(String(name))+"?v=1":""}
function avatarMarkup(name,online=false){const src=profilePictureUrl(name);return `<div class="avatar"><span class="avatarInitial">${escapeHTML(String(name||"?").charAt(0).toUpperCase())}</span>${src?`<img class="avatarImage" src="${escapeHTML(src)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:""}${online?'<div class="online"></div>':""}</div>`}
const ZYPHOR_ROLE_BADGES={"Administrator":{icon:"A",className:"roleAdministrator",title:"Zyphor Administrator",description:"This user has the Administrator staff role."},"Support":{icon:"S",className:"roleSupport",title:"Zyphor Support",description:"This user has the Support staff role."},"Moderator":{icon:"M",className:"roleModerator",title:"Zyphor Moderator",description:"This user has the Moderator staff role."},"Beta Tester":{icon:"B",className:"roleBetaTester",title:"Zyphor Beta Tester",description:"This user has the Beta Tester role."},"Staff":{icon:"S",className:"roleStaff",title:"Zyphor Staff",description:"Legacy staff badge. Deploy the updated backend to show the exact role."}}
function roleBadgeInfo(name){return ZYPHOR_ROLE_BADGES[name]||{icon:String(name||"•"),className:"roleOther",title:String(name||"Badge"),description:"Zyphor badge: "+String(name||"Badge")}}
function showRoleInfo(name){const meta=roleBadgeInfo(name);alert(meta.title+"\n\n"+meta.description)}
function badgeMarkup(b,small=false){const name=String(b?.name||"Badge"),meta=roleBadgeInfo(name);return `<button type="button" class="roleBadge ${meta.className}${small?" msgRoleBadge":""}" title="${escapeHTML(meta.title)}" aria-label="${escapeHTML(meta.title)}" data-role="${escapeHTML(name)}" onclick="event.stopPropagation();showRoleInfo(this.dataset.role)">${escapeHTML(meta.icon)}</button>`}
async function syncPinned(){try{const r=await api("/dms/pinned",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pinnedDms:pinnedFriends})});const data=await safeJson(r);if(!data?.success)throw new Error(data?.error||"sync_failed");setPinned(data.pinnedDms||[]);renderFriends()}catch{showNotice("Pinned conversations could not be synced with the server.")}}
function showNotice(text){let n=document.getElementById("pageNotice");if(!n){n=document.createElement("div");n.id="pageNotice";n.style.cssText="position:fixed;z-index:70000;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 24px));padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);box-shadow:0 15px 45px #0008;font:12px Inter,system-ui;text-align:center";document.body.appendChild(n)}n.textContent=text;clearTimeout(n._timer);n._timer=setTimeout(()=>n.remove(),3200)}
function togglePin(friend,event){event.stopPropagation();let pins=getPinned();pins=pins.includes(friend)?pins.filter(x=>x!==friend):[friend,...pins];setPinned(pins);renderFriends();syncPinned()}
async function getBackend(){const r=await fetch("server.txt",{cache:"no-store"});if(!r.ok)throw new Error("backend_url_unavailable");return(await r.text()).trim().replace(/\/+$/,"")}
async function safeJson(r){const t=await r.text();try{return JSON.parse(t)}catch{return null}}
async function api(path,options={}){const liveToken=localStorage.getItem("Token");if(!liveToken){location.href="login.html";throw new Error("unauthorized")}const headers=new Headers(options.headers||{});headers.set("Authorization",liveToken);return fetch(backend+path,{...options,headers})}
async function trackPage(page){if(!localStorage.getItem("Token"))return;try{await api("/track/page",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({page})})}catch{}}
async function refreshState(){try{const r=await api("/dms/state"),data=await safeJson(r);if(!r.ok||!data||data.error){if(data?.error==="unauthorized")location.href="login.html";return}state={friends:Array.isArray(data.friends)?data.friends:[],chats:Array.isArray(data.chats)?data.chats:[],incomingRequests:Array.isArray(data.incomingRequests)?data.incomingRequests:[],friendBadges:data.friendBadges&&typeof data.friendBadges==="object"?data.friendBadges:{},pinnedDms:Array.isArray(data.pinnedDms)?data.pinnedDms:[]};if(Array.isArray(data.pinnedDms))setPinned(data.pinnedDms);renderRequests();renderFriends()}catch{showNotice("Could not load conversations. Check your connection and try again.")}}
function renderRequests(){requestCount.textContent=state.incomingRequests.length;requestList.innerHTML="";requestsButton.setAttribute("aria-expanded",String(!requestList.hidden));if(!state.incomingRequests.length){requestList.hidden=true;return}if(requestList.dataset.userOpened!=="1")requestList.hidden=true;state.incomingRequests.forEach(r=>{const d=document.createElement("div");d.className="friend requestCard";d.innerHTML=`${avatarMarkup(r.from)}<div class="info"><div class="name">${escapeHTML(r.from)}</div><div class="preview">Sent you a friend request</div></div><div class="requestActions"><button class="mini accept" type="button" aria-label="Accept request from ${escapeHTML(r.from)}"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button><button class="mini decline" type="button" aria-label="Decline request from ${escapeHTML(r.from)}"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>`;d.querySelector(".accept").onclick=e=>{e.stopPropagation();acceptRequest(r.id,r.from)};d.querySelector(".decline").onclick=e=>{e.stopPropagation();declineRequest(r.id)};requestList.appendChild(d)});if(requestList.hidden)requestList.dataset.hasRequests="1"}
requestsButton.addEventListener("click",()=>{if(!state.incomingRequests.length)return;requestList.hidden=!requestList.hidden;requestList.dataset.userOpened=requestList.hidden?"0":"1";requestsButton.setAttribute("aria-expanded",String(!requestList.hidden))})
function emptyState(title,description){return `<div class="empty"><div class="emptyIcon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg></div><strong>${escapeHTML(title)}</strong><p>${escapeHTML(description)}</p></div>`}
function renderFriends(){friendList.innerHTML="";if(!state.friends.length){friendList.innerHTML=emptyState("Your inbox is ready","Search for a username above to add a friend and start a conversation.");return}const pins=getPinned();const sorted=[...state.friends].sort((a,b)=>{const ap=pins.includes(a),bp=pins.includes(b);if(ap!==bp)return ap?-1:1;const aa=state.chats.find(c=>c.with===a)||{},bb=state.chats.find(c=>c.with===b)||{};const time=new Date(bb.lastTime||0)-new Date(aa.lastTime||0);return time||(Number(bb.unread||0)-Number(aa.unread||0))||a.localeCompare(b)});let shownPinned=false,shownOthers=false;sorted.forEach(friend=>{const pinned=pins.includes(friend);if(pinned&&!shownPinned){friendList.insertAdjacentHTML("beforeend",'<div class="sectionLabel">Pinned <span>QUICK ACCESS</span></div>');shownPinned=true}if(!pinned&&!shownOthers){friendList.insertAdjacentHTML("beforeend",'<div class="sectionLabel">Conversations <span>DIRECT MESSAGES</span></div>');shownOthers=true}const c=state.chats.find(x=>x.with===friend)||{};const d=document.createElement("div");d.className="friend"+(pinned?" pinned":"");const badges=Array.isArray(state.friendBadges?.[friend])?state.friendBadges[friend]:[];const badgesMarkup=badges.map(b=>badgeMarkup(b)).join("");const unread=Number(c.unread||0);const when=c.lastTime?new Date(c.lastTime).toLocaleDateString([], {month:"short",day:"numeric"}):"";const preview=c.lastAuthor?`${escapeHTML(c.lastAuthor===myName?"You":c.lastAuthor)}: ${escapeHTML(c.lastMessage||"")}`:"No messages yet";d.innerHTML=`${avatarMarkup(friend,true)}<div class="info"><div class="nameLine"><div class="name">${escapeHTML(friend)}</div>${badgesMarkup}</div><div class="preview">${preview}</div></div><div class="friendMeta">${when?`<span class="previewTime">${escapeHTML(when)}</span>`:""}${unread?`<span class="unread">${unread>99?"99+":unread}</span>`:""}</div><button class="pinBtn ${pinned?"pinned":""}" type="button" title="${pinned?"Unpin conversation":"Pin conversation"}" aria-label="${pinned?"Unpin":"Pin"} ${escapeHTML(friend)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-4 1-4 4v5l-2 2-2-7-7-2 2-2h5l4-4z"/></svg></button>`;d.onclick=()=>openChat(friend);d.querySelector(".pinBtn").onclick=e=>togglePin(friend,e);friendList.appendChild(d)})}
async function setChatAvatar(friend){const src=profilePictureUrl(friend);chatAvatarInitial.textContent=String(friend||"?").charAt(0).toUpperCase();chatAvatarImage.hidden=true;chatAvatarImage.removeAttribute("src");chatAvatarInitial.style.display="";if(!src)return;chatAvatarImage.onload=()=>{chatAvatarImage.hidden=false;chatAvatarInitial.style.display="none"};chatAvatarImage.onerror=()=>{chatAvatarImage.hidden=true;chatAvatarInitial.style.display=""};chatAvatarImage.src=src}
async function openChat(friend,markSeen=true){if(!friend)return;const sameConversation=activeFriend===friend;const previousMessages=sameConversation?loadedMessages.slice():[];const previousCursor=chatPageCursor;const previouslyHadOlder=chatHasMore;let r,data;try{r=await api("/dms/chat?with="+encodeURIComponent(friend)+"&limit=50");data=await safeJson(r)}catch{showNotice("Could not open this conversation.");return}if(!r.ok||!data||data.error||!data.chat){showNotice(data?.error||"Could not load this conversation.");return}activeFriend=friend;chat.style.display="flex";chatTitle.textContent=friend;chatState.textContent="Private conversation";document.getElementById("app").setAttribute("aria-hidden","true");chat.removeAttribute("aria-hidden");const activeBadges=state.friendBadges?.[friend]||[];chatRoleBadges.innerHTML=activeBadges.map(b=>badgeMarkup(b)).join("");await setChatAvatar(friend);const pageMessages=Array.isArray(data.chat.messages)?data.chat.messages:[];if(sameConversation&&previousMessages.length){const merged=new Map();for(const m of [...pageMessages,...previousMessages])merged.set(m.messageId||`${m.time}|${m.author}|${m.text}`,m);loadedMessages=[...merged.values()].sort((a,b)=>new Date(a.time||0)-new Date(b.time||0));chatHasMore=previouslyHadOlder?true:!!data.chat.hasMore;chatPageCursor=previouslyHadOlder?previousCursor:(data.chat.nextBefore||null)}else{loadedMessages=pageMessages;chatHasMore=!!data.chat.hasMore;chatPageCursor=data.chat.nextBefore||null}data.chat.messages=loadedMessages;data.chat.hasMore=chatHasMore;data.chat.nextBefore=chatPageCursor;data.chat.totalMessages=Number(data.chat.totalMessages??data.chat.messageCount??loadedMessages.length);const j=JSON.stringify(data.chat);if(j!==lastChatJSON){lastChatJSON=j;renderMessages(data.chat)}if(markSeen)await api("/dms/seen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chatId:friend})})}
function escapeHTML(t){return String(t??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function formatTime(t){try{return new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch{return""}}
function renderMessages(data){const previousTop=messages.scrollTop,previousHeight=messages.scrollHeight,wasNearBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<120;messages.innerHTML="";if(data.hasMore){const older=document.createElement("button");older.className="olderMessagesButton";older.textContent=loadingOlder?"Loading earlier messages…":"Load earlier messages";older.disabled=loadingOlder;older.onclick=loadOlderMessages;messages.appendChild(older)}if(!data.messages.length){const wrap=document.createElement("div");wrap.innerHTML=emptyState("Start the conversation","Send a message to get things going.");messages.appendChild(wrap.firstElementChild);return}data.messages.forEach(m=>{const me=m.author===myName,row=document.createElement("div");row.className="row "+(me?"me":"them");const authorName=m.author||"Unknown";const avatar=document.createElement("div");avatar.className="messageAvatar";avatar.innerHTML=`<span class="avatarInitial">${escapeHTML(authorName.charAt(0).toUpperCase())}</span>${profilePictureUrl(authorName)?`<img class="avatarImage" src="${escapeHTML(profilePictureUrl(authorName))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:""}`;const bubble=document.createElement("div");bubble.className="bubble";if(!me){const author=document.createElement("div");author.className="messageAuthor";author.textContent=authorName;for(const badge of (state.friendBadges?.[authorName]||[])){const holder=document.createElement("span");holder.innerHTML=badgeMarkup(badge,true);author.appendChild(holder.firstElementChild)}bubble.appendChild(author)}if(m.text){const text=document.createElement("div");text.textContent=m.text;bubble.appendChild(text)}for(const imgData of (m.images||[])){const img=document.createElement("img");img.src=backend+imgData.url;img.loading="lazy";img.alt=imgData.originalName||"Image attachment";img.onclick=()=>window.open(backend+imgData.url,"_blank","noopener");bubble.appendChild(img)}const time=document.createElement("div");time.className="time";time.textContent=formatTime(m.time);bubble.appendChild(time);if(me){const receipt=document.createElement("div");receipt.className="receipt";const other=data.users?.find(u=>u!==myName);receipt.textContent=data.lastRead?.[other]&&new Date(data.lastRead[other])>=new Date(m.time)?"Read":"Sent";bubble.appendChild(receipt)}if(me)row.append(bubble,avatar);else row.append(avatar,bubble);messages.appendChild(row)});requestAnimationFrame(()=>{if(wasNearBottom)messages.scrollTop=messages.scrollHeight;else if(previousHeight>0)messages.scrollTop=previousTop+Math.max(0,messages.scrollHeight-previousHeight)})}
async function loadOlderMessages(){if(!activeFriend||!chatHasMore||!chatPageCursor||loadingOlder)return;loadingOlder=true;const friend=activeFriend,before=chatPageCursor,oldHeight=messages.scrollHeight,oldTop=messages.scrollTop;try{const r=await api(`/dms/chat?with=${encodeURIComponent(friend)}&limit=50&before=${encodeURIComponent(before)}`),data=await safeJson(r);if(!data?.chat||data.error||activeFriend!==friend)return;const combined=new Map();for(const m of [...(data.chat.messages||[]),...loadedMessages])combined.set(m.messageId||`${m.time}|${m.author}|${m.text}`,m);loadedMessages=[...combined.values()].sort((a,b)=>new Date(a.time||0)-new Date(b.time||0));chatHasMore=!!data.chat.hasMore;chatPageCursor=data.chat.nextBefore||null;data.chat.messages=loadedMessages;data.chat.hasMore=chatHasMore;data.chat.nextBefore=chatPageCursor;data.chat.totalMessages=Number(data.chat.totalMessages??loadedMessages.length);lastChatJSON=JSON.stringify(data.chat);loadingOlder=false;renderMessages(data.chat);requestAnimationFrame(()=>{messages.scrollTop=Math.max(0,messages.scrollHeight-oldHeight+oldTop)})}catch{}finally{loadingOlder=false}}
messages.addEventListener("scroll",()=>{if(messages.scrollTop<45&&chatHasMore)loadOlderMessages()})
async function sendMessage(){if(!activeFriend||sendBtn.disabled)return;const text=messageBox.value.trim();if(!text&&!imagePicker.files.length)return;const recipient=activeFriend,form=new FormData();form.append("chatId",recipient);form.append("message",text);for(const f of imagePicker.files)form.append("images",f);sendBtn.disabled=true;try{const r=await api("/dms/send",{method:"POST",body:form}),data=await safeJson(r);if(!r.ok||!data||data.error){showNotice(data?.error||"Message could not be sent.");return}messageBox.value="";messageBox.style.height="auto";imagePicker.value="";await openChat(recipient,false);await refreshState()}catch{showNotice("Message failed. The server could not be reached.")}finally{sendBtn.disabled=false;messageBox.focus()}}
sendBtn.onclick=e=>{e.preventDefault();sendMessage()}
composerForm.addEventListener("submit",e=>{e.preventDefault();sendMessage()})
messageBox.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}})
messageBox.addEventListener("input",()=>{messageBox.style.height="auto";messageBox.style.height=Math.min(messageBox.scrollHeight,140)+"px"})
backButton.onclick=()=>{chat.style.display="none";chat.setAttribute("aria-hidden","true");document.getElementById("app").removeAttribute("aria-hidden");activeFriend="";lastChatJSON="";loadedMessages=[];chatPageCursor=null;chatHasMore=false;loadingOlder=false;messageBox.value="";messageBox.style.height="auto"}
addFriendBtn.onclick=addFriend
searchUser.addEventListener("keydown",e=>{if(e.key==="Enter")addFriend()})
async function addFriend(){const username=searchUser.value.trim();if(!username)return;addFriendBtn.disabled=true;try{const r=await api("/friends/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})}),data=await safeJson(r);if(!data)return;if(data.success){searchUser.value="";showNotice("Friend request sent.");refreshState();return}showNotice(data.error||"Friend request could not be sent.")}finally{addFriendBtn.disabled=false}}
async function acceptRequest(requestId,from){const r=await api("/friends/accept",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requestId})}),data=await safeJson(r);if(!data)return;await refreshState();openChat(from)}
async function declineRequest(requestId){await api("/friends/decline",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requestId})});refreshState()}
async function init(){try{try{const saved=JSON.parse(localStorage.getItem("zyphorPinnedDMs")||"[]");pinnedFriends=Array.isArray(saved)?saved:[]}catch{pinnedFriends=[]}backend=await getBackend();token=localStorage.getItem("Token");if(!token){location.href="login.html";return}await trackPage("1dms.html");const r=await api("/me"),me=await safeJson(r);if(!r.ok||!me||me.error||!me.username){localStorage.removeItem("Token");location.href="login.html";return}myName=me.username;localStorage.setItem("username",myName);await refreshState();const raw=location.hash.slice(1);let wanted="";try{wanted=decodeURIComponent(raw).trim()}catch{wanted=raw.trim()}if(wanted){const found=state.friends.find(x=>String(x).toLowerCase()===wanted.toLowerCase());if(found)await openChat(found,true)}setInterval(async()=>{await refreshState();if(activeFriend){await openChat(activeFriend,false);await api("/dms/seen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chatId:activeFriend})}).catch(()=>{})}},5000)}catch{showNotice("Could not connect to Zyphor. Reload the page to retry.")}}
init()
</script>

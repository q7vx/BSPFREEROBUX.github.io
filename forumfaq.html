<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e18">
<title>Community FAQ — Zyphor</title>
<style>
html{color-scheme:dark}body{margin:0;min-height:100vh;background:radial-gradient(circle at 40% 0%,#211f43,#090d17 60%);color:#e8eaf7;display:grid;place-items:center;font:15px system-ui,sans-serif}.loading{text-align:center;padding:40px;max-width:450px}.logo{font-size:27px;font-weight:900;letter-spacing:-1px}.logo span{color:#a39bff}.spinner{width:32px;height:32px;border:3px solid #37415e;border-top-color:#a39bff;border-radius:50%;animation:spin .8s linear infinite;margin:28px auto}@keyframes spin{to{transform:rotate(360deg)}}p{color:#a1abc2;line-height:1.6}a{color:#c1baff}
</style>
</head>
<body>
<main class="loading"><div class="logo">ZYPHOR <span>COMMUNITY</span></div><div class="spinner" aria-hidden="true"></div><p id="status">Connecting to the community...</p><p><a href="/">Back to Zyphor</a></p></main>
<script>
(async()=>{
try{
const response=await fetch('/server.txt',{cache:'no-store'});
if(!response.ok)throw Error('Community server is unavailable.');
const url=new URL((await response.text()).trim());
if(url.protocol!=='https:'&&url.hostname!=='localhost')throw Error('Invalid community server.');
const host=url.origin;
const page=await fetch(host+'/forumfaq.html',{cache:'no-store'});
if(!page.ok)throw Error('The community page could not be loaded.');
const raw=await page.text();
if(!/^\s*<!doctype html>/i.test(raw))throw Error('Unexpected community response.');
const html=raw.replaceAll('href="/forum.css"','href="'+host+'/forum.css"').replaceAll('src="/forum.js"','src="'+host+'/forum.js"');
document.open();document.write(html);document.close();
}catch(error){document.getElementById('status').textContent=error.message+' Please refresh to try again.';}
})();
</script>
</body>
</html>

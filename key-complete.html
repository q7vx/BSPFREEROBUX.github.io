
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0e14">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https://zyphor.cc; script-src 'sha256-GEf5xfta0N6tRiyJ7S7s2bwxcl9eobuDTvEUGCKjrws='; style-src 'sha256-dckV/LFYS5U20dgCLFunq/aWM8mj2moDTLSSQ/x725Y='; connect-src 'self' https:; base-uri 'none'; form-action 'none'">
    <title>Your Key | Zyphor</title>
    <link rel="icon" href="https://zyphor.cc/Logo1.png">
    <style>
        :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #0c0e14; color: #f4f5fa; display: flex; flex-direction: column; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 18px; }
        .card { width: 100%; max-width: 440px; padding: 36px 30px; text-align: center; background: #151821; border: 1px solid #292d3b; border-radius: 18px; box-shadow: 0 18px 60px #0006; }
        .logo { display: block; width: 64px; height: 64px; object-fit: contain; margin: 0 auto 22px; border-radius: 14px; }
        h1 { font-size: 25px; letter-spacing: -.6px; margin: 0 0 10px; }
        .subtitle { font-size: 14px; line-height: 1.7; color: #999eae; margin: 0 0 25px; }
        .label { display: block; font-size: 12px; color: #a4a9ba; text-align: left; margin-bottom: 9px; font-weight: 650; }
        .key-shell { position: relative; display: flex; align-items: center; border: 1px solid #34394d; border-radius: 10px; background: #0e1119; min-height: 56px; transition: border-color .2s; }
        .key-shell:hover, .key-shell:focus-within { border-color: #6966b9; }
        .key-box { flex: 1; min-width: 0; padding: 16px; padding-right: 8px; color: #c7bcff; font: 14px/1.6 Consolas, monospace; overflow-wrap: anywhere; text-align: left; filter: blur(7px); user-select: none; transition: filter .2s; }
        .key-shell.is-revealed .key-box { filter: none; user-select: all; }
        .eye-button { flex: 0 0 auto; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; margin: 0 8px 0 0; color: #b7afd6; background: transparent; border: 0; border-radius: 9px; cursor: pointer; }
        .eye-button:hover, .eye-button:focus-visible { color: #fff; background: #262a3a; transform: none; }
        .eye-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .eye-button .eye-off { display: none; }
        .eye-button[aria-pressed="true"] .eye-on { display: none; }
        .eye-button[aria-pressed="true"] .eye-off { display: block; }
        .timer-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding: 13px 15px; border: 1px solid #292d3b; border-radius: 10px; background: #10131c; text-align: left; }
        .timer-label { font-size: 12px; color: #a4a9ba; }
        .timer-value { font: 600 13px/1.5 Consolas, monospace; color: #c7bcff; text-align: right; font-variant-numeric: tabular-nums; }
        .expiry-note { margin-top: 8px; color: #858a9b; font-size: 11px; text-align: right; }
        button { display: block; margin-top: 15px; width: 100%; padding: 14px; border: 0; border-radius: 10px; background: linear-gradient(120deg, #676bff, #895cff); color: white; font-size: 14px; font-weight: 650; cursor: pointer; transition: filter .2s, transform .2s; }
        button:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .notice { margin: 20px 0 0; font-size: 12px; line-height: 1.6; color: #858a9b; }
        footer { padding: 22px 18px; text-align: center; border-top: 1px solid #20232e; color: #777d8e; font-size: 12px; }
        .footer-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 18px; margin-bottom: 12px; }
        a { color: #a8aafc; text-decoration: none; }
        a:hover { color: #fff; }
        .copyright { line-height: 1.8; }
        [hidden] { display: none !important; }
        @media (max-width: 480px) { .card { padding: 30px 21px; } h1 { font-size: 23px; } }
    </style>
</head>
<body>
    <main>
        <section class="card">
            <img class="logo" src="https://zyphor.cc/Logo1.png" alt="Zyphor logo">
            <h1 id="title">Checking your key...</h1>
            <p class="subtitle" id="subtitle">Verifying your key with Jnkie.</p>
            <div id="keySection" hidden>
                <div class="label">YOUR ACCESS KEY</div>
                <div class="key-shell" id="keyShell">
                    <div class="key-box" id="key"></div>
                    <button class="eye-button" id="reveal" type="button" aria-label="Show key" aria-pressed="false" title="Hover to view, click to keep visible">
                        <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.7-7 10-7 10 7 10 7-3.7 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.3 0 10 7 10 7a17 17 0 0 1-3.3 4.1M6.1 6.1C3.4 8 2 12 2 12s3.7 7 10 7c1.7 0 3.3-.5 4.6-1.2M2 2l20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                </div>
                <div class="timer-card">
                    <span class="timer-label">Time left</span>
                    <span class="timer-value" id="timeLeft">Checking...</span>
                </div>
                <div class="expiry-note" id="expiryNote" hidden></div>
                <button id="copy" type="button">Copy Key</button>
                <p class="notice">Keep your key private and don't share it with anyone.</p>
            </div>
            <noscript>JavaScript needs to be enabled to view your key.</noscript>
        </section>
    </main>
    <footer>
        <nav class="footer-links">
            <a href="https://zyphor.cc/tos.html">Terms of Service</a>
            <a href="https://zyphor.cc/pp.html">Privacy Policy</a>
            <a href="https://zyphor.cc/">Zyphor</a>
        </nav>
        <div class="copyright">
            &copy; <span id="year">2026</span> Zyphor.cc. All rights reserved.<br>
            Made by <a href="https://zyphor.cc/">Team Vaprix</a>
        </div>
    </footer>
    <script>
        const title = document.getElementById("title");
        const subtitle = document.getElementById("subtitle");
        const section = document.getElementById("keySection");
        const keyElement = document.getElementById("key");
        const keyShell = document.getElementById("keyShell");
        const revealButton = document.getElementById("reveal");
        const copyButton = document.getElementById("copy");
        const timeLeft = document.getElementById("timeLeft");
        const expiryNote = document.getElementById("expiryNote");
        const url = new URL(location.href);
        const providedKeys = url.searchParams.getAll("key");
        const key = providedKeys.length === 1 ? providedKeys[0] : "";
        let resetCopyText;
        let countdown;
        let pinned = false;
        let hovering = false;

        document.getElementById("year").textContent = new Date().getFullYear();

        function showError(heading, message) {
            title.textContent = heading;
            subtitle.textContent = message;
            section.hidden = true;
            clearInterval(countdown);
        }

        function updateReveal() {
            keyShell.classList.toggle("is-revealed", pinned || hovering);
            revealButton.setAttribute("aria-pressed", String(pinned));
            revealButton.setAttribute("aria-label", pinned ? "Hide key" : "Show key");
            revealButton.title = pinned ? "Click to hide key" : "Hover to view, click to keep visible";
        }

        keyShell.addEventListener("pointerenter", event => {
            if (event.pointerType === "mouse" || event.pointerType === "pen") {
                hovering = true;
                updateReveal();
            }
        });

        keyShell.addEventListener("pointerleave", () => {
            hovering = false;
            updateReveal();
        });

        revealButton.addEventListener("click", () => {
            pinned = !pinned;
            updateReveal();
        });

        document.addEventListener("pointerdown", event => {
            if (pinned && !keyShell.contains(event.target)) {
                pinned = false;
                updateReveal();
            }
        });

        function selectKey() {
            pinned = true;
            updateReveal();
            const range = document.createRange();
            range.selectNodeContents(keyElement);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        copyButton.addEventListener("click", async () => {
            if (section.hidden) return;
            try {
                await navigator.clipboard.writeText(key);
                copyButton.textContent = "✓ Copied!";
            } catch {
                selectKey();
                copyButton.textContent = "Selected — copy it manually";
            }
            clearTimeout(resetCopyText);
            resetCopyText = setTimeout(() => copyButton.textContent = "Copy Key", 2500);
        });

        function formatRemaining(ms) {
            const total = Math.max(0, Math.ceil(ms / 1000));
            const days = Math.floor(total / 86400);
            const hours = Math.floor((total % 86400) / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const seconds = total % 60;
            return (days ? days + "d " : "") + String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
        }

        function startCountdown(result) {
            clearInterval(countdown);
            const expiresAt = result.expiresAt ?? result.expires_at;
            const remainingMs = typeof result.remainingMs === "number" && Number.isFinite(result.remainingMs) ? Math.max(0, result.remainingMs) : null;
            const hasExpiryData = Object.prototype.hasOwnProperty.call(result, "expiresAt") || Object.prototype.hasOwnProperty.call(result, "expires_at") || remainingMs !== null;
            const expiryTimestamp = expiresAt ? Date.parse(expiresAt) : NaN;

            if (expiresAt && Number.isFinite(expiryTimestamp)) {
                expiryNote.hidden = false;
                expiryNote.textContent = "Expires: " + new Date(expiryTimestamp).toLocaleString();
            }

            if (remainingMs === null && !Number.isFinite(expiryTimestamp)) {
                timeLeft.textContent = hasExpiryData && !expiresAt ? "No expiration" : "Unavailable";
                return;
            }

            const remaining = remainingMs !== null ? remainingMs : Math.max(0, expiryTimestamp - Date.now());
            const deadline = performance.now() + remaining;

            function tick() {
                const ms = Math.max(0, deadline - performance.now());
                timeLeft.textContent = formatRemaining(ms);
                if (ms <= 0) showError("Key expired", "This key has expired. Go complete the key system again.");
            }

            tick();
            if (!section.hidden) countdown = setInterval(tick, 1000);
        }

        async function getBackendUrl(signal) {
            const response = await fetch("/server.txt?" + Date.now(), {
                cache: "no-store",
                credentials: "omit",
                referrerPolicy: "no-referrer",
                signal
            });
            if (!response.ok) throw new Error("Server configuration unavailable");
            const address = (await response.text()).trim();
            const backend = new URL(address);
            if (backend.protocol !== "https:" && !(backend.protocol === "http:" && ["localhost", "127.0.0.1", "[::1]"].includes(backend.hostname))) {
                throw new Error("Invalid backend URL");
            }
            return backend.origin;
        }

        async function verifyKey() {
            if (!key || key.length > 256 || key.trim() !== key || providedKeys.length !== 1) {
                showError("No key? 💀", "bro you ain't getting a key by just opening this page 😭 go do the key system (editing the url ofc won't give you shit) 🧠");
                return;
            }

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);

            try {
                const backendUrl = await getBackendUrl(controller.signal);
                const response = await fetch(backendUrl + "/api/jnkie/key-check", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ key }),
                    credentials: "omit",
                    cache: "no-store",
                    referrerPolicy: "no-referrer",
                    signal: controller.signal
                });
                const result = await response.json();

                if (!response.ok || result.valid !== true) {
                    showError(response.status === 429 ? "Too many attempts" : response.status >= 500 ? "Couldn't check your key" : "That key isn't valid 💀", response.status === 429 ? "Try again in a minute." : response.status >= 500 ? "Jnkie verification isn't available right now. Try again later." : "go do the key system 😭 editing the url won't give you a real key 🧠");
                    return;
                }

                title.textContent = "Your key is ready!";
                subtitle.textContent = "Key verified. Copy it below and use it to continue.";
                keyElement.textContent = key;
                section.hidden = false;
                startCountdown(result);
            } catch {
                showError("Couldn't check your key", "Jnkie verification isn't available right now. Try again later.");
            } finally {
                clearTimeout(timeout);
            }
        }

        verifyKey();
    </script>
</body>
</html>

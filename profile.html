<title>Zyphor Profile</title>
<script>
(function () {
    const phone = localStorage.getItem("Phone");
    const params = window.location.search;

    if (phone === "1") {
        window.location.replace("1profile.html" + params);
    } else {
        window.location.replace("0profile.html" + params);
    }
})();
</script>

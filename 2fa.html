<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zyphor — 2FA</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(135deg,#020617,#0f172a 55%,#172554);
color:#fff;
font-family:Arial,sans-serif
}
.card{
width:100%;
max-width:480px;
background:#0f172a;
border:1px solid #263449;
border-radius:24px;
padding:30px;
box-shadow:0 25px 80px #0008
}
.logo{
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;
border-radius:15px;
background:#2563eb;
font-size:21px;
font-weight:900;
margin-bottom:22px
}
h1{margin:0 0 8px;font-size:28px}
.subtitle{margin:0 0 25px;color:#94a3b8;line-height:1.5;font-size:14px}
.section{
padding:18px;
border:1px solid #1e293b;
background:#0b1220;
border-radius:17px;
margin-top:15px
}
.title{font-weight:800;font-size:15px;margin-bottom:7px}
.text{font-size:13px;color:#94a3b8;line-height:1.5;margin-bottom:15px}
input{
width:100%;
height:50px;
padding:0 14px;
border-radius:12px;
border:1px solid #334155;
background:#111827;
color:#fff;
outline:none;
font-size:15px;
margin-bottom:10px
}
input:focus{border-color:#3b82f6}
.code{
font-size:23px;
font-weight:800;
letter-spacing:8px;
text-align:center
}
button{
width:100%;
border:0;
border-radius:12px;
padding:13px 16px;
background:#2563eb;
color:#fff;
font-size:14px;
font-weight:800;
cursor:pointer
}
button:hover{background:#1d4ed8}
button:disabled{opacity:.5;cursor:not-allowed}
.switchrow{
display:flex;
align-items:center;
justify-content:space-between;
gap:18px
}
.switchlabel{font-weight:800}
.switchtext{font-size:13px;color:#64748b;margin-top:5px}
.switch{
position:relative;
width:54px;
height:30px;
flex:none
}
.switch input{display:none}
.slider{
position:absolute;
inset:0;
border-radius:999px;
background:#334155;
cursor:pointer;
transition:.2s
}
.slider:before{
content:"";
position:absolute;
width:24px;
height:24px;
left:3px;
top:3px;
border-radius:50%;
background:#fff;
transition:.2s
}
.switch input:checked+.slider{background:#2563eb}
.switch input:checked+.slider:before{transform:translateX(24px)}
.hidden{display:none!important}
.status{
display:none;
margin-top:16px;
padding:12px 14px;
border-radius:12px;
background:#111827;
font-size:13px;
line-height:1.45
}
.status.show{display:block}
.status.success{color:#4ade80}
.status.error{color:#f87171}
.loading{text-align:center;color:#94a3b8;padding:35px 0}
</style>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5179004241080538" crossorigin="anonymous"></script>
</head>
<body>

<div class="card">
<div id="loading" class="loading">Connecting to Zyphor...</div>

<div id="content" class="hidden">
<div class="logo">Z</div>

<h1>Two-Factor Authentication</h1>

<p class="subtitle">
Secure your Zyphor account with email verification and two-factor authentication.
</p>

<div id="emailSection" class="section">
<div class="title">Connect your email</div>
<div class="text">
Enter the email address you want attached to your account. We'll send you a verification code.
</div>

<input id="email" type="email" autocomplete="email" placeholder="you@example.com">
<button id="sendEmailButton">Send verification code</button>

<div id="emailCodeBox" class="hidden" style="margin-top:15px">
<input id="emailCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
<button id="verifyEmailButton">Verify email</button>
</div>
</div>

<div id="twoFASection" class="section hidden">
<div class="switchrow">
<div>
<div class="switchlabel">Email 2FA</div>
<div id="connectedEmail" class="switchtext"></div>
</div>

<label class="switch">
<input id="twoFAToggle" type="checkbox">
<span class="slider"></span>
</label>
</div>
</div>

<div id="status" class="status"></div>
</div>
</div>

<script>
let SERVER_URL=""
let emailVerified=false
let twoFAEnabled=false

const loading=document.getElementById("loading")
const content=document.getElementById("content")
const email=document.getElementById("email")
const emailCode=document.getElementById("emailCode")
const emailCodeBox=document.getElementById("emailCodeBox")
const sendEmailButton=document.getElementById("sendEmailButton")
const verifyEmailButton=document.getElementById("verifyEmailButton")
const twoFASection=document.getElementById("twoFASection")
const twoFAToggle=document.getElementById("twoFAToggle")
const connectedEmail=document.getElementById("connectedEmail")
const status=document.getElementById("status")

function getToken(){
return localStorage.getItem("Token")||""
}

async function getServer(){
const response=await fetch("server.txt?"+Date.now(),{cache:"no-store"})
if(!response.ok)throw new Error("server.txt")
const url=(await response.text()).trim().replace(/\/+$/,"")
if(!/^https?:\/\//i.test(url))throw new Error("invalid server url")
return url
}

async function api(path,options={}){
const response=await fetch(SERVER_URL+path,{
...options,
headers:{
"Content-Type":"application/json",
"Authorization":getToken(),
...(options.headers||{})
}
})
return await response.json()
}

function showStatus(text,type=""){
status.textContent=text
status.className="status show "+type
}

function errorText(error){
const errors={
unauthorized:"Your session has expired. Please log in again.",
missing:"Please fill in all required fields.",
invalidemail:"Please enter a valid email address.",
emailused:"That email is already attached to another account.",
emailsendfailed:"The verification email could not be sent.",
nocode:"No verification code is active.",
expired:"The verification code has expired.",
wrongcode:"Incorrect verification code.",
noemail:"You need to verify an email first.",
server:"The server returned an error."
}
return errors[error]||"Something went wrong. Please try again."
}

async function init(){
try{
SERVER_URL=await getServer()

if(!getToken()){
loading.classList.add("hidden")
content.classList.remove("hidden")
showStatus("You are not logged in.","error")
return
}

loading.classList.add("hidden")
content.classList.remove("hidden")
}catch{
loading.textContent="Unable to connect to the server."
}
}

sendEmailButton.addEventListener("click",async()=>{
const value=email.value.trim()

if(!value){
showStatus("Enter your email address.","error")
return
}

sendEmailButton.disabled=true

try{
const result=await api("/account/add-email",{
method:"POST",
body:JSON.stringify({email:value})
})

if(result.success){
emailCodeBox.classList.remove("hidden")
showStatus("Verification code sent. Check your email.","success")
emailCode.focus()
}else{
showStatus(errorText(result.error),"error")
}
}catch{
showStatus("Unable to contact the server.","error")
}finally{
sendEmailButton.disabled=false
}
})

verifyEmailButton.addEventListener("click",async()=>{
const code=emailCode.value.trim()

if(!/^\d{6}$/.test(code)){
showStatus("Enter the 6-digit verification code.","error")
return
}

verifyEmailButton.disabled=true

try{
const result=await api("/account/verify-email",{
method:"POST",
body:JSON.stringify({code})
})

if(result.success){
emailVerified=true
connectedEmail.textContent=result.email||email.value.trim()
twoFASection.classList.remove("hidden")
email.disabled=true
emailCode.disabled=true
sendEmailButton.classList.add("hidden")
verifyEmailButton.classList.add("hidden")
showStatus("Email verified and attached to your account.","success")
}else{
showStatus(errorText(result.error),"error")
}
}catch{
showStatus("Unable to contact the server.","error")
}finally{
verifyEmailButton.disabled=false
}
})

twoFAToggle.addEventListener("change",async()=>{
if(!emailVerified){
twoFAToggle.checked=false
return
}

const requested=twoFAToggle.checked
twoFAToggle.disabled=true

try{
const result=await api("/2fa/toggle",{
method:"POST",
body:JSON.stringify({enabled:requested})
})

if(result.success){
twoFAEnabled=requested
twoFAToggle.checked=requested
showStatus(
requested
?"Two-factor authentication is now enabled."
:"Two-factor authentication is now disabled.",
"success"
)
}else{
twoFAToggle.checked=twoFAEnabled
showStatus(errorText(result.error),"error")
}
}catch{
twoFAToggle.checked=twoFAEnabled
showStatus("Unable to contact the server.","error")
}finally{
twoFAToggle.disabled=false
}
})

emailCode.addEventListener("input",()=>{
emailCode.value=emailCode.value.replace(/\D/g,"").slice(0,6)
})

init()
</script>

</body>
</html>

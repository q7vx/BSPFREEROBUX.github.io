<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zyphor Cloud</title>
<style>
:root{
  --bg:#05070d;--panel:rgba(14,19,31,.76);--panel2:rgba(20,27,43,.88);
  --line:rgba(255,255,255,.09);--muted:#8794aa;--text:#f6f8ff;
  --cyan:#00d5ff;--purple:#8b3dff;--danger:#ff5577;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:var(--text);background:
 radial-gradient(circle at 15% -10%,rgba(0,213,255,.20),transparent 28%),
 radial-gradient(circle at 90% 5%,rgba(139,61,255,.20),transparent 30%),
 linear-gradient(180deg,#070a12,#04060b 70%);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(circle at 30% 50%,rgba(0,213,255,.05),transparent 24%),
 radial-gradient(circle at 75% 65%,rgba(139,61,255,.05),transparent 26%);
}
button,input{font:inherit}
button{cursor:pointer}
.shell{max-width:1500px;margin:auto;padding:28px}
.topbar{
 display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px;
}
.brand{display:flex;align-items:center;gap:13px}
.brandMark{
 width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
 background:linear-gradient(135deg,rgba(0,213,255,.18),rgba(139,61,255,.25));
 border:1px solid rgba(255,255,255,.11);box-shadow:0 0 28px rgba(0,213,255,.10);
 font-size:23px
}
.brand h1{font-size:20px;margin:0;letter-spacing:.5px}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.back{
 border:1px solid var(--line);background:rgba(255,255,255,.045);color:#dfe6f3;
 padding:11px 16px;border-radius:13px;transition:.2s
}
.back:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
.hero{
 padding:30px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(135deg,rgba(18,25,40,.86),rgba(9,13,22,.74));
 backdrop-filter:blur(25px);box-shadow:0 25px 80px rgba(0,0,0,.32);position:relative;overflow:hidden
}
.hero:after{
 content:"";position:absolute;width:420px;height:420px;right:-180px;top:-220px;border-radius:50%;
 background:radial-gradient(circle,rgba(0,213,255,.16),transparent 68%);pointer-events:none
}
.heroHead{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;position:relative;z-index:1}
.hero h2{font-size:clamp(30px,4vw,48px);margin:0 0 8px;letter-spacing:-1.5px}
.hero p{margin:0;color:var(--muted);max-width:680px;line-height:1.55}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{
 min-width:115px;padding:12px 14px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px
}
.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}
.controls{
 margin-top:25px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative;z-index:2
}
.searchWrap{flex:1;min-width:240px;position:relative}
.searchWrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#68758b}
.search{
 width:100%;height:46px;padding:0 15px 0 42px;border:1px solid var(--line);border-radius:14px;
 outline:0;background:rgba(0,0,0,.20);color:white;transition:.2s
}
.search:focus{border-color:rgba(0,213,255,.45);box-shadow:0 0 0 4px rgba(0,213,255,.07)}
.primary,.ghost{
 height:46px;border-radius:14px;padding:0 17px;border:1px solid var(--line);font-weight:750;transition:.2s
}
.primary{background:linear-gradient(90deg,#00a9df,#7637d6);color:white;border:0;box-shadow:0 10px 30px rgba(0,166,230,.16)}
.primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
.ghost{background:rgba(255,255,255,.045);color:#dbe4f1}.ghost:hover{background:rgba(255,255,255,.085)}
.upload{
 margin-top:18px;border:1px dashed rgba(0,213,255,.32);border-radius:19px;padding:18px;
 display:flex;align-items:center;gap:15px;background:rgba(0,213,255,.025);transition:.2s
}
.upload.drag{border-color:var(--cyan);background:rgba(0,213,255,.07)}
.uploadIcon{
 width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
 background:rgba(0,213,255,.09);font-size:21px
}
.uploadText{flex:1}.uploadText b{display:block;font-size:14px}.uploadText span{font-size:12px;color:var(--muted)}
input[type=file]{display:none}
.storage{
 margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.025)
}
.storageRow{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:11px}
.storageRow b{font-size:14px}.storageRow span{font-size:12px;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--purple));box-shadow:0 0 18px rgba(0,213,255,.35);transition:width .4s}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 14px}
.sectionHead h3{margin:0;font-size:16px}.sectionHead span{color:var(--muted);font-size:12px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
.dayTitle{grid-column:1/-1;margin:12px 3px 0;font-size:14px;color:#dce4f0}
.photo{
 position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:#0c111b;
 border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 35px rgba(0,0,0,.22);isolation:isolate
}
.photo img{width:100%;height:100%;display:block;object-fit:cover;transition:.45s}
.photo:hover img{transform:scale(1.045)}
.photoTop{
 position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;z-index:3
}
.fileName{
 max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 10px;border-radius:10px;
 background:rgba(3,6,12,.66);backdrop-filter:blur(10px);font-size:11px
}
.check{
 width:28px;height:28px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
 background:rgba(3,6,12,.66);accent-color:var(--cyan)
}
.overlay{
 position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;
 background:linear-gradient(180deg,transparent 25%,rgba(2,5,10,.94) 100%);
 opacity:0;transition:.22s;z-index:2
}
.photo:hover .overlay,.photo:focus-within .overlay{opacity:1}
.meta{font-size:11px;color:#aab6c8;line-height:1.5;margin-bottom:10px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{padding:4px 7px;border-radius:999px;background:rgba(0,213,255,.09);color:#8be8ff;border:1px solid rgba(0,213,255,.13)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{
 border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);color:white;border-radius:9px;padding:8px 10px;font-size:11px
}
.actions button:hover{background:rgba(255,255,255,.16)}
.actions .danger:hover{background:rgba(255,85,119,.18);border-color:rgba(255,85,119,.35)}
.empty{
 grid-column:1/-1;padding:60px 20px;text-align:center;border:1px dashed var(--line);border-radius:22px;
 color:var(--muted);background:rgba(255,255,255,.018)
}
.emptyIcon{font-size:40px;margin-bottom:10px;opacity:.8}.empty b{display:block;color:#e9eef8;margin-bottom:5px}
.toast{
 position:fixed;right:24px;bottom:24px;z-index:10000;padding:13px 16px;border:1px solid var(--line);
 border-radius:13px;background:rgba(13,18,29,.94);box-shadow:0 20px 50px rgba(0,0,0,.4);
 opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s
}
.toast.show{opacity:1;transform:none}
@media(max-width:700px){
 .shell{padding:16px}.hero{padding:20px}.heroHead{align-items:flex-start;flex-direction:column}
 .stats{width:100%}.stat{flex:1}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .photo{border-radius:15px}.overlay{opacity:1}.upload{align-items:flex-start}.uploadText{min-width:0}
}
@media(max-width:430px){.gallery{grid-template-columns:1fr}.stats{display:grid;grid-template-columns:1fr 1fr}.primary,.ghost{flex:1}}
</style>

</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand">
    <div class="brandMark">☁</div>
    <div><h1>ZYPHOR CLOUD</h1><p>Your private media space</p></div>
  </div>
  <button class="back" onclick="location.href='dashboard.html'">← Dashboard</button>
</header>

<section class="hero">
  <div class="heroHead">
    <div>
      <h2>Your Cloud</h2>
      <p>Store, search, organize and download your images in one clean workspace.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="fileCount">—</b><span>Files</span></div>
      <div class="stat"><b id="favoriteCount">—</b><span>Favorites</span></div>
      <div class="stat"><b id="storageMini">—</b><span>Used</span></div>
    </div>
  </div>

  <div class="controls">
    <div class="searchWrap"><span>⌕</span><input id="search" class="search" placeholder="Search files, tags, albums or descriptions..." oninput="searchFiles()"></div>
    <button class="ghost" onclick="selectAll()">Select all</button>
    <button class="primary" onclick="document.getElementById('file').click()">＋ Upload</button>
  </div>

  <div id="upload" class="upload">
    <div class="uploadIcon">↑</div>
    <div class="uploadText"><b>Drop an image here</b><span>PNG, JPG or JPEG • upload directly to your Zyphor Cloud</span></div>
    <input type="file" id="file" accept=".png,.jpg,.jpeg">
    <button class="ghost" onclick="uploadFile()">Choose file</button>
  </div>

  <div id="storage" class="storage"></div>
</section>

<div class="sectionHead"><h3>Library</h3><span id="resultLabel">Loading…</span></div>
<div id="files" class="gallery"><div class="empty"><div class="emptyIcon">☁</div><b>Loading your cloud</b>Please wait…</div></div>
</div>

<div id="toast" class="toast"></div>

<script>
let backend=null,currentSearch=0,toastTimer=null;

async function getBackend(){const r=await fetch("server.txt");return(await r.text()).trim()}
async function safeJson(r){try{return await r.json()}catch{return null}}
function token(){return localStorage.getItem("Token")}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2400)}
function bytes(n){if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";if(n<1073741824)return (n/1048576).toFixed(1)+" MB";return (n/1073741824).toFixed(2)+" GB"}

async function init(){
 backend=await getBackend();
 if(!token()){location.href="login.html";return}
 const r=await fetch(backend+"/me",{headers:{Authorization:token()}});
 const d=await safeJson(r);
 if(!d||d.error){localStorage.removeItem("Token");location.href="login.html";return}
 setupDropzone();loadFiles();
}

function setupDropzone(){
 const area=document.getElementById("upload"),input=document.getElementById("file");
 input.addEventListener("change",()=>{if(input.files.length)uploadFile()});
 ["dragenter","dragover"].forEach(e=>area.addEventListener(e,x=>{x.preventDefault();area.classList.add("drag")}));
 ["dragleave","drop"].forEach(e=>area.addEventListener(e,x=>{x.preventDefault();area.classList.remove("drag")}));
 area.addEventListener("drop",e=>{if(e.dataTransfer.files.length){input.files=e.dataTransfer.files;uploadFile()}});
}

async function uploadFile(){
 const input=document.getElementById("file");
 if(!input.files.length){toast("Choose an image first");return}
 const file=input.files[0];
 if(!["image/png","image/jpeg","image/jpg"].includes(file.type)){toast("Only PNG, JPG and JPEG are supported");return}
 const fd=new FormData();fd.append("file",file);
 const xhr=new XMLHttpRequest();xhr.open("POST",backend+"/cloud/upload");
 xhr.setRequestHeader("Authorization",token());
 xhr.onload=()=>{const d=JSON.parse(xhr.responseText||"{}");if(!xhr.status.toString().startsWith("2")||d.error){toast(d.error||"Upload failed");return}input.value="";toast("Uploaded successfully");loadFiles()};
 xhr.onerror=()=>toast("Upload failed");xhr.send(fd);
}

function renderStorage(files){
 const total=files.reduce((s,f)=>s+(f.size||0),0),pct=Math.min(100,total/1073741824*100);
 document.getElementById("storage").innerHTML=`<div class="storageRow"><b>Storage</b><span>${bytes(total)} / 1 GB</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
 document.getElementById("storageMini").textContent=bytes(total);
 document.getElementById("fileCount").textContent=files.length;
 document.getElementById("favoriteCount").textContent=files.filter(f=>f.favorite).length;
}

function fileCard(file,url){
 const div=document.createElement("div");div.className="photo";
 const tags=(file.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
 div.innerHTML=`
 <div class="photoTop"><div class="fileName" title="${esc(file.name)}">${esc(file.name)}</div><input class="check selectFile" type="checkbox" value="${esc(file.name)}"></div>
 <img src="${url}" alt="${esc(file.name)}" loading="lazy">
 <div class="overlay">
  <div class="meta">📁 ${esc(file.album||"No album")}<br>📝 ${esc(file.description||"No description")}${tags?`<div class="tags">${tags}</div>`:""}</div>
  <div class="actions">
   <button onclick="downloadFile('${encodeURIComponent(file.name)}')">↓ Download</button>
   <button onclick="editTags(this,'${esc(file.name)}')">🏷 Tags</button>
   <button onclick="toggleFavorite(this,'${esc(file.name)}',${!!file.favorite})">${file.favorite?"⭐":"☆"}</button>
   <button class="danger" onclick="deleteFile('${esc(file.name)}')">Delete</button>
  </div>
 </div>`;
 return div;
}

async function renderFiles(files){
 const box=document.getElementById("files");box.innerHTML="";
 document.getElementById("resultLabel").textContent=`${files.length} file${files.length===1?"":"s"}`;
 if(!files.length){box.innerHTML=`<div class="empty"><div class="emptyIcon">✦</div><b>No images found</b>Upload something or try a different search.</div>`;return}
 const groups={};
 files.forEach(f=>{const day=new Date(f.uploadedAt||Date.now()).toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});(groups[day]??=[]).push(f)});
 for(const day of Object.keys(groups)){
  const title=document.createElement("div");title.className="dayTitle";title.textContent=day;box.appendChild(title);
  for(const file of groups[day]){
   try{
    const r=await fetch(backend+"/cloud/download/"+encodeURIComponent(file.name),{headers:{Authorization:token()}});
    const blob=await r.blob(),url=URL.createObjectURL(blob);box.appendChild(fileCard(file,url));
   }catch{}
  }
 }
}

async function loadFiles(){
 const r=await fetch(backend+"/cloud/list",{headers:{Authorization:token()}});
 const d=await safeJson(r);if(!d||!d.files){toast("Could not load cloud");return}
 renderStorage(d.files);await renderFiles(d.files);
}

async function searchFiles(){
 const id=++currentSearch,q=document.getElementById("search").value.trim();
 if(!q){loadFiles();return}
 const r=await fetch(backend+"/cloud/search",{method:"POST",headers:{Authorization:token(),"Content-Type":"application/json"},body:JSON.stringify({query:q})});
 const d=await safeJson(r);if(id!==currentSearch)return;
 if(!d||!d.files){toast("Search failed");return}
 await renderFiles(d.files);
}

async function toggleFavorite(button,name,current){
 const next=!current;
 const r=await fetch(backend+"/cloud/favorite",{method:"POST",headers:{Authorization:token(),"Content-Type":"application/json"},body:JSON.stringify({name,favorite:next})});
 const d=await safeJson(r);if(d&&d.error){toast(d.error);return}
 button.textContent=next?"⭐":"☆";button.setAttribute("onclick",`toggleFavorite(this,'${name}',${next})`);toast(next?"Added to favorites":"Removed from favorites");
}

async function downloadFile(name){
 const r=await fetch(backend+"/cloud/download/"+name,{headers:{Authorization:token()}});
 if(!r.ok){toast("Download failed");return}
 const url=URL.createObjectURL(await r.blob()),a=document.createElement("a");a.href=url;a.download=decodeURIComponent(name);a.click();URL.revokeObjectURL(url);
}

async function deleteFile(name){
 if(!confirm(`Delete "${decodeURIComponent(name)}"?`))return;
 await fetch(backend+"/cloud/delete",{method:"POST",headers:{"Content-Type":"application/json",Authorization:token()},body:JSON.stringify({name:decodeURIComponent(name)})});
 toast("File deleted");loadFiles();
}

async function removeTag(name,tag){
 await fetch(backend+"/cloud/tags/remove",{method:"POST",headers:{Authorization:token(),"Content-Type":"application/json"},body:JSON.stringify({files:[name],tags:[tag]})});
 loadFiles();
}

async function editTags(button,name){
 const r=await fetch(backend+"/cloud/list",{headers:{Authorization:token()}}),d=await safeJson(r),file=d?.files?.find(f=>f.name===name);
 if(!file){toast("File not found");return}
 const input=prompt("Use +tag to add or -tag to remove.\n\nCurrent: "+((file.tags||[]).join(", ")||"None"));
 if(!input?.trim())return;
 const mode=input[0],tag=input.slice(1).trim();if(!tag||!["+","-"].includes(mode)){toast("Use +tag or -tag");return}
 const endpoint=mode==="+"?"/cloud/tags/add":"/cloud/tags/remove";
 await fetch(backend+endpoint,{method:"POST",headers:{Authorization:token(),"Content-Type":"application/json"},body:JSON.stringify({files:[name],tags:[tag]})});
 loadFiles();
}

function selectAll(){
 const boxes=[...document.querySelectorAll(".selectFile")],all=boxes.length&&boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);
}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";loadFiles()}})
init();
</script>
</body>
</html>
